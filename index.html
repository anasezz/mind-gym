<title>Mind Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first game library. Home = stats header, today's pick, one swipeable rail of colour cards per training area.
   Exercise screens: chunky header with score pill, big centred play area, pressable 3D buttons. */
:root{
  --bg:#f4f2fb; --surface:#ffffff; --ink:#1c1836; --mute:#6b6688; --line:#e2def0;
  --good:#16a34a; --bad:#e11d48; --accent:#7445d6; --cc:var(--accent); --on:#ffffff;
  --c-att:#e04e30; --c-spd:#f2a516; --c-mem:#3366ee; --c-ppl:#d63384; --c-int:#7445d6; --c-nav:#0d9488;
  --t1:#16a34a; --t2:#d97706; --t3:#e11d48;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14112a; --surface:#201c3b; --ink:#f1effa; --mute:#a39fc0; --line:#352f5a;
  --good:#34d399; --bad:#fb7185; --accent:#9b7bf0; --t1:#22c55e; --t2:#f59e0b; --t3:#f43f5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14112a; --surface:#201c3b; --ink:#f1effa; --mute:#a39fc0; --line:#352f5a;
  --good:#34d399; --bad:#fb7185; --accent:#9b7bf0; --t1:#22c55e; --t2:#f59e0b; --t3:#f43f5e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--cc);outline-offset:3px}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:14px 18px;min-height:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;display:flex;flex-direction:column;gap:26px;padding-bottom:12px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.eyebrow{margin:0;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* home */
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}
.home-head h1{font-size:2.2rem;font-weight:800;line-height:1;margin-top:4px;white-space:nowrap}
.stats{display:flex;gap:8px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:7px 10px;text-align:center;min-width:66px;box-shadow:0 3px 0 var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.66rem;color:var(--mute);font-weight:700}
.pick{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;background:var(--cc);color:var(--on);border-radius:26px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.22);position:relative;overflow:hidden;transition:transform .08s}
.pick-ic{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;position:relative}
.pick-tx{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.pick-tx .eyebrow{color:inherit;opacity:.85}
.pick-tx b{font-family:var(--f-display);font-size:1.5rem;line-height:1.1}
.pick-tx em{font-style:normal;font-size:.88rem;opacity:.92;line-height:1.35}
.pick .play{grid-column:1/-1;justify-self:start;background:var(--on);color:var(--cc);font-weight:800;font-family:var(--f-display);padding:10px 22px;border-radius:999px;position:relative}
.bgi{position:absolute;right:-22px;bottom:-26px;opacity:.15;transform:rotate(-12deg);pointer-events:none}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cat-h h3{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:8px}
.cat-h h3 i{width:12px;height:12px;border-radius:4px;background:var(--cc);display:inline-block}
.cat-h span{font-size:.78rem;color:var(--mute);font-weight:700}
.sub{margin:3px 0 12px;color:var(--mute);font-size:.88rem}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.gcard{flex:0 0 146px;height:170px;scroll-snap-align:start;border-radius:24px;background:var(--cc);color:var(--on);text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .08s}
.gcard:active,.pick:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.gcard .gic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;position:relative}
.gcard b{font-family:var(--f-display);font-size:1.08rem;line-height:1.15;position:relative}
.gcard .meta{display:flex;gap:6px;align-items:center;position:relative}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.26);padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums}

/* exercise chrome */
.top{display:flex;align-items:center;gap:12px}
.top h2{flex:1;font-size:1.12rem;font-weight:800;min-width:0;line-height:1.15}
.top h2 small{display:block;font-family:var(--f-body);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cc);margin-bottom:2px}
.ib{width:46px;height:46px;border-radius:15px;border:2px solid var(--line);background:var(--surface);flex:none;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.scorepill{font-family:var(--f-display);font-weight:800;font-size:1.02rem;font-variant-numeric:tabular-nums;background:var(--cc);color:var(--on);padding:8px 14px;border-radius:999px;min-width:46px;text-align:center;white-space:nowrap}
.scorepill:empty{display:none}
.intro{flex:1;display:flex;flex-direction:column;gap:20px;overflow-y:auto;padding:22px 2px 8px;min-height:0}
.bigic{width:92px;height:92px;border-radius:28px;background:var(--cc);color:var(--on);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.22);flex:none}
.intro h1{font-size:2.3rem;font-weight:800;line-height:1.05}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--cc);color:var(--on);font-family:var(--f-display);font-weight:800;display:flex;align-items:center;justify-content:center}
.note{margin:0;font-size:.88rem;color:var(--mute);display:flex;gap:8px;align-items:center;line-height:1.4}
.note svg{flex:none;color:var(--cc)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile2{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--line);text-align:left}
.tile2 b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.15}
.tile2 span{font-size:.78rem;color:var(--mute);font-weight:700}
.dock{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.cta{width:100%;background:var(--cc);color:var(--on);border-radius:20px;font-weight:800;font-size:1.2rem;padding:17px 24px;font-family:var(--f-display);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .06s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ghost{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:15px 24px;font-weight:800;font-family:var(--f-display);font-size:1.05rem;box-shadow:0 4px 0 var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#hint{margin:16px 0 6px;color:var(--ink);font-weight:700;font-size:1.04rem;min-height:1.5em;text-align:center;text-wrap:balance}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
#v{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px}
#k{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:8rem;color:var(--cc);z-index:6}
.count span{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}

/* results */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative;overflow:hidden;min-height:0}
.stars{display:flex;gap:6px;align-items:flex-end}
.stars svg{width:42px;height:42px}
.stars svg:nth-child(2){width:54px;height:54px}
.ring{width:180px;height:180px;border-radius:50%;border:12px solid var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.ring b{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.ring span{font-size:.72rem;color:var(--mute);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.msg{font-size:1.6rem;font-weight:800}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}

/* game pieces */
.btn{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;padding:0 12px;box-shadow:0 4px 0 var(--line);font-family:var(--f-display);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.on{background:var(--cc);color:var(--on);border-color:var(--cc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,14vw,5rem);line-height:1.1;text-align:center}
.pad{width:100%;min-height:104px;border-radius:24px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:1.6rem;box-shadow:0 6px 0 var(--line)}
.pad:active,.pad.on{background:var(--cc);color:var(--on);border-color:var(--cc);transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.box{position:relative;width:min(100%,340px);aspect-ratio:1;border:2px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden}
.box>*{position:absolute;transform:translate(-50%,-50%);line-height:1}
.box>.noise{inset:0;width:100%;height:100%;transform:none;image-rendering:pixelated}
.slot{width:46px;height:46px;border-radius:50%;border:2px dashed var(--mute);background:transparent;padding:0}
.slot.lit{background:var(--cc);border-style:solid;border-color:var(--cc)}
.slot.ok{background:var(--good);border-color:var(--good);border-style:solid}
.slot.no{background:var(--bad);border-color:var(--bad);border-style:solid}
.arena{position:relative;border:2px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden;touch-action:none;max-width:100%}
.orb{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--cc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:var(--on);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.orb.tgt{box-shadow:0 0 0 5px var(--good)}.orb.sel{box-shadow:0 0 0 5px var(--ink)}.orb.no{background:var(--bad)}
.g{display:grid;gap:10px;width:min(100%,340px)}
.cell{aspect-ratio:1;border:2px solid var(--line);background:var(--surface);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.8rem;box-shadow:0 3px 0 var(--line)}
.cell.lit{background:var(--cc);border-color:var(--cc)}.cell.ok{background:var(--good);border-color:var(--good)}.cell.no{background:var(--bad);border-color:var(--bad)}
.mcard{aspect-ratio:1;border-radius:16px;background:var(--cc);font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;color:var(--on);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.mcard.up{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}.mcard.done{background:var(--surface);color:var(--ink);opacity:.4;box-shadow:none}
.card{width:120px;height:170px;border-radius:16px;border:2px solid var(--line);background:#fffdf8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:2.6rem;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.card small{font-size:2.2rem}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,360px)}
.faces button{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:4px;display:flex;justify-content:center;box-shadow:0 3px 0 var(--line)}
.faces button svg{width:100%;height:auto}
.road{position:relative;width:100%;height:min(52vh,380px);border-radius:24px;overflow:hidden;border:2px solid var(--line)}
.road>div{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:pointer}
canvas.sw{width:min(100%,300px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.rt{display:flex;gap:16px;justify-content:center}
.rt div{width:130px;height:130px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:22px;background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:5rem}
.rhy{position:relative;width:min(100%,340px);height:40px;border-bottom:3px solid var(--line)}
.rhy b{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%;background:var(--cc);transform:translateX(-50%)}
.rhy b.u{background:var(--ink);bottom:24px;width:10px;height:10px}
.story{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;line-height:1.5;max-width:40ch}
.tag{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cc)}
.disp{font-family:var(--f-display);font-weight:800;font-size:2.4rem;min-height:1.3em;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-align:center}
.fb{position:absolute;inset:0;pointer-events:none;border-radius:24px;opacity:0;transition:opacity .25s;z-index:5}
.fb.good{background:var(--good)}.fb.bad{background:var(--bad)}

/* levels */
.ihead{display:flex;align-items:center;gap:16px}
.ihead .bigic{width:76px;height:76px;border-radius:24px}
.ihead h1{font-size:2rem}
.levels{display:flex;flex-direction:column;gap:14px}
.tier-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.tier-h b{font-family:var(--f-display);font-size:1.05rem;color:var(--tc)}
.tier-h span{font-size:.78rem;color:var(--mute);text-align:right}
.lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvb{height:72px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.lvb b{font-family:var(--f-display);font-size:1.5rem;line-height:1;display:flex}
.lvb span{color:var(--c-spd);font-size:.95rem;letter-spacing:2px;line-height:1}
.lvb.sel{border-color:var(--tc);background:var(--tc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.lvb.sel span{color:#fff}
.lvb:active{transform:translateY(3px)}
.lvb:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;transform:none}
.lvbar{display:flex;gap:3px;position:relative}
.lvbar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.lvbar i.on{background:var(--on)}
.ring.fail{border-color:var(--line)}

/* report */
.rcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.rcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.rbars{display:flex;align-items:flex-end;gap:4px;height:44px;width:62px}
.rbars i{flex:1;border-radius:3px;background:var(--cc)}
.rtx{display:flex;flex-direction:column;gap:3px;font-size:.92rem;line-height:1.35;min-width:0}
.rgo{color:var(--mute)}
.sec-h{font-size:1.15rem;font-weight:800;margin-bottom:12px}
.sw2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swc{background:var(--cc);color:var(--on);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.swc .eyebrow{color:inherit;opacity:.85}
.swc b{font-family:var(--f-display);font-size:1.3rem;line-height:1.15}
.swc em{font-style:normal;font-weight:700;opacity:.9}
.areas,.weak,.sugg{display:flex;flex-direction:column;gap:12px}
.arow{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.atop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.atop b{font-family:var(--f-display);font-size:1.02rem}
.atop span{font-size:.85rem;font-weight:800;color:var(--cc);font-variant-numeric:tabular-nums}
.abar{height:10px;border-radius:5px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.abar i{display:block;height:100%;border-radius:5px;background:var(--cc)}
.arow p,.srow p{margin:0;font-size:.82rem;color:var(--mute);line-height:1.4}
.wrow,.shead{display:flex;align-items:center;gap:12px}
.wrow{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.gic2{width:40px;height:40px;border-radius:13px;background:var(--cc);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
.wtx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.wtx b{font-family:var(--f-display);font-size:1rem}
.wtx span{font-size:.8rem;color:var(--mute)}
.srow{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 var(--line)}
.sgo{background:var(--cc);color:var(--on);font-family:var(--f-display);font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sgo:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}

/* workout, check, charts, settings */
.wcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--accent);color:#fff;border-radius:26px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .08s}
.wcard:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.wcard .eyebrow{color:inherit;opacity:.85}
.wcard>b{font-family:var(--f-display);font-size:1.5rem;line-height:1.1}
.wdots{display:flex;gap:8px;margin:4px 0}
.wd{width:42px;height:42px;border-radius:14px;background:var(--cc);color:var(--on);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.wd.ok{background:#fff;color:var(--accent)}
.wmeta{font-size:.86rem;opacity:.92}
.wcard .play{align-self:flex-start;background:#fff;color:var(--accent);font-weight:800;font-family:var(--f-display);padding:10px 22px;border-radius:999px;margin-top:4px}
.pdots{display:flex;gap:6px}
.pdots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pdots i.ok{background:var(--good)}.pdots i.cur{background:var(--cc)}
.why{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;line-height:1.45;font-size:.95rem}

<script>
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
let store={};try{store=JSON.parse(localStorage.getItem('mindgym2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mindgym2',JSON.stringify(store))}catch(e){}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- sound ---------- */
let actx=null;
function AC(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A()}if(actx.state==='suspended')actx.resume();return actx}
function tone(f1,f2,ms,vol=.22,type='sine'){const a=AC();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+ms/1000);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);
  g.gain.setValueAtTime(vol,t+Math.max(.006,ms/1000-.01));g.gain.linearRampToValueAtTime(0,t+ms/1000);o.connect(g).connect(a.destination);o.start(t);o.stop(t+ms/1000+.02)}
const NATIVE=typeof window.AndroidTTS!=='undefined';
const hasSpeech=NATIVE||('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window);
const ttsWait={};let ttsN=0;window.__ttsDone=id=>{const f=ttsWait[id];if(f){delete ttsWait[id];f()}};
function say(t,rate=1){return new Promise(res=>{if(!hasSpeech){res();return}let done=false;const fin=()=>{if(!done){done=true;res()}};
  if(NATIVE){const id='u'+(++ttsN);ttsWait[id]=fin;try{window.AndroidTTS.speak(t,rate,id)}catch(e){fin()}}
  else{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}}
  setTimeout(fin,1500+t.length*120/rate)})}
function hush(){try{if(NATIVE)window.AndroidTTS.stop();else if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}

/* ---------- shared helpers ---------- */
const stair=(start,min,max,f=.85)=>{let v=start,ok=0;return{get v(){return Math.round(v)},hit(){if(++ok>=2){ok=0;v=Math.max(min,v*f)}},miss(){ok=0;v=Math.min(max,v/f)}}};
function options(el,labels,cb,cls='grid2'){const w=mk('div',cls);labels.forEach(l=>{const b=mk('button','btn',l);b.onclick=()=>cb(l,b);w.append(b)});el.append(w);return w}
const ask=(k,labels,cls)=>new Promise(res=>{k.replaceChildren();options(k,labels,l=>{k.replaceChildren();res(l)},cls)});
function flash(c,ok,count=true,step=true){if(count&&c.tally)c.tally(ok);if(step&&c.trial)c.trial(ok);const f=$('.fb',c.stage);if(f){f.className='fb '+(ok?'good':'bad');f.style.opacity=.28;setTimeout(()=>{f.style.opacity=0},170)}buzz(ok?10:40)}
function lay(c){c.stage.innerHTML='<div class="fb"></div><div id="v"></div><div id="k"></div>';return[$('#v',c.stage),$('#k',c.stage)]}
function keypad(el,onKey,okLabel='✓'){const k=mk('div','grid3');k.style.width='min(100%,320px)';
  ['1','2','3','4','5','6','7','8','9','⌫','0',okLabel].forEach(x=>{const b=mk('button','btn',x);b.onclick=()=>onKey(x===okLabel?'ok':x==='⌫'?'del':x);k.append(b)});el.append(k);return k}
const ringXY=(i,n,r,off=-Math.PI/2)=>{const a=i/n*Math.PI*2+off;return[50+r*Math.cos(a),50+r*Math.sin(a)]};
function put(b,html,x,y,fs=2,rot=0){const e=mk('div');e.innerHTML=html;e.style.left=x+'%';e.style.top=y+'%';e.style.fontSize=fs+'rem';if(rot)e.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;b.append(e);return e}
function noise(b){const cv=mk('canvas','noise');cv.width=cv.height=72;const x=cv.getContext('2d'),d=x.createImageData(72,72);
  for(let i=0;i<d.data.length;i+=4){const v=rnd(256);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);b.append(cv);return cv}
function slots(b,n,r){return [...Array(n)].map((_,i)=>{const[x,y]=ringXY(i,n,r);const s=mk('button','slot');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label','Position '+(i+1));b.append(s);return s})}
const tapOne=els=>new Promise(res=>els.forEach((e,i)=>e.onclick=()=>{els.forEach(x=>x.onclick=null);res(i)}));
function scatter(n,minD,pad=10){const p=[];let g=0;while(p.length<n&&g++<3000){const x=pad+Math.random()*(100-2*pad),y=pad+Math.random()*(100-2*pad);if(p.every(q=>Math.hypot(q[0]-x,q[1]-y)>minD))p.push([x,y])}return p}
const arenaSize=()=>[Math.min(innerWidth-32,480),Math.max(240,Math.min(innerHeight-300,420))];
function spawnOrbs(ar,n,W,H){const o=[];const pos=scatter(n,14,6);for(let i=0;i<n;i++){const e=mk('div','orb');ar.append(e);
  const q={e,x:(pos[i]?pos[i][0]:rnd(90))/100*(W-40),y:(pos[i]?pos[i][1]:rnd(90))/100*(H-40),a:Math.random()*6.283};e.style.left=q.x+'px';e.style.top=q.y+'px';o.push(q)}return o}
function drift(c,o,W,H,ms,sp){return new Promise(res=>{let last=performance.now();const end=last+ms;const f=t=>{if(!c.alive)return;const dt=Math.min(50,Math.max(0,t-last))/1000;last=t;
  o.forEach(q=>{q.x+=Math.cos(q.a)*sp*dt;q.y+=Math.sin(q.a)*sp*dt;
    if(q.x<0||q.x>W-40){q.a=Math.PI-q.a;q.x=Math.max(0,Math.min(W-40,q.x))}
    if(q.y<0||q.y>H-40){q.a=-q.a;q.y=Math.max(0,Math.min(H-40,q.y))}
    if(Math.random()<.015)q.a+=(Math.random()-.5)*1.2;q.e.style.left=q.x+'px';q.e.style.top=q.y+'px'});
  if(t<end)requestAnimationFrame(f);else res()};requestAnimationFrame(f)})}
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];

/* ---------- faces (drawn, not photos) ---------- */
const SK=['#f3d2b3','#e0ac81','#c68642','#8d5524','#f6dcc6','#d9a066'],HC=['#2b1b12','#6a3b1a','#b5651d','#d8b25c','#8a8a8a','#111111','#a23b1c'];
function rface(){return{skin:pick(SK),hair:pick(HC),hs:rnd(4),ew:11+rnd(8),es:3+rnd(3),nose:rnd(3),rx:27+rnd(9),gl:rnd(4)===0,mu:rnd(5)===0}}
function varyFace(p,n){const q={...p};shuffle(['skin','hair','hs','ew','nose','rx','gl','mu','es']).slice(0,n).forEach(k=>{let t=0;do{q[k]=rface()[k]}while(q[k]===p[k]&&t++<30)});return q}
const EMO={happy:[0,0,'smile'],sad:[-7,1,'frown'],angry:[8,-2,'tight'],surprised:[0,7,'o'],afraid:[-6,6,'wave'],disgusted:[6,-1,'sneer'],neutral:[0,0,'flat'],contempt:[2,0,'smirk'],tired:[0,-3,'flat'],proud:[-1,2,'smile2'],confused:[5,3,'tilt']};
function faceSVG(p,emo='neutral',k=1,shift=0){const E=EMO[emo]||EMO.neutral,tilt=E[0]*k,raise=E[1]*k,m=E[2],sq=1-Math.abs(shift)*.28,ey=54,ex=p.ew;
  const back=p.hs===1?`<ellipse cx="50" cy="70" rx="${p.rx+7}" ry="46" fill="${p.hair}"/>`:'';
  const cap=p.hs===2?'':p.hs===3?[...Array(9)].map((_,i)=>`<circle cx="${50-p.rx+i*p.rx/4}" cy="${30+Math.abs(i-4)*3}" r="9" fill="${p.hair}"/>`).join(''):`<path d="M${48-p.rx} 56 Q50 6 ${52+p.rx} 56 Q50 32 ${48-p.rx} 56Z" fill="${p.hair}"/>`;
  const lid=emo==='tired'?`<path d="M${50-ex-6} ${ey} h12 M${50+ex-6} ${ey} h12" stroke="${p.skin}" stroke-width="5"/>`:'';
  const er=p.es+Math.max(0,raise)*.25;
  const eyes=[50-ex,50+ex].map(x=>`<ellipse cx="${x}" cy="${ey}" rx="${er+2.5}" ry="${er+1.5}" fill="#fff"/><circle cx="${x+shift*2}" cy="${ey}" r="${er-.5}" fill="#1d1d1d"/>`).join('');
  const by=ey-11-raise*.9;
  const brows=`<path d="M${50-ex-8} ${by} L${50-ex+7} ${by+tilt*.6}" stroke="#2a1d16" stroke-width="2.6" stroke-linecap="round"/><path d="M${50+ex-7} ${by+tilt*.6+(emo==='confused'?-5*k:0)} L${50+ex+8} ${by}" stroke="#2a1d16" stroke-width="2.6" stroke-linecap="round"/>`;
  const ny=66+p.nose*3,nose=`<path d="M50 ${ny-10} L47 ${ny} L53 ${ny}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.8" stroke-linejoin="round"/>`;
  const my=86,M={smile:`M39 ${my} Q50 ${my+14*k} 61 ${my}`,smile2:`M42 ${my+1} Q50 ${my+7*k} 58 ${my+1}`,frown:`M40 ${my+5} Q50 ${my+5-12*k} 60 ${my+5}`,tight:`M42 ${my+3} Q50 ${my+3-4*k} 58 ${my+3}`,
    wave:`M40 ${my+3} Q45 ${my+3-5*k} 50 ${my+3} T60 ${my+3}`,sneer:`M40 ${my+3} Q48 ${my+3} 60 ${my-4*k}`,flat:`M42 ${my+2} L58 ${my+2}`,smirk:`M42 ${my+2} Q52 ${my+2} 59 ${my-3*k}`,tilt:`M42 ${my+3} L58 ${my+3-4*k}`};
  const mouth=m==='o'?`<ellipse cx="50" cy="${my+3}" rx="${4+2*k}" ry="${3+6*k}" fill="#5a1f1f"/>`:`<path d="${M[m]}" fill="none" stroke="#7a2b2b" stroke-width="3" stroke-linecap="round"/>`;
  const mu=p.mu?`<path d="M41 ${my-5} Q50 ${my-10} 59 ${my-5}" stroke="${p.hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`:'';
  const gl=p.gl?`<g fill="none" stroke="#333" stroke-width="2"><circle cx="${50-ex}" cy="${ey}" r="${p.es+6}"/><circle cx="${50+ex}" cy="${ey}" r="${p.es+6}"/><path d="M${50-ex+p.es+6} ${ey} L${50+ex-p.es-6} ${ey}"/></g>`:'';
  return `<svg viewBox="0 0 100 120" width="96" height="115" aria-hidden="true">${back}<ellipse cx="50" cy="64" rx="${p.rx}" ry="40" fill="${p.skin}"/>${cap}<g transform="translate(${shift*14} 0) translate(50 0) scale(${sq} 1) translate(-50 0)">${eyes}${lid}${brows}${nose}${mu}${mouth}${gl}</g></svg>`}

const CATS={
  att:{name:'Attention',sub:'Focus on what matters and filter out distractions.',c:'var(--c-att)',on:'#ffffff'},
  spd:{name:'Brain Speed',sub:'Take in sights and sounds faster and more accurately.',c:'var(--c-spd)',on:'#2d1d00'},
  mem:{name:'Memory',sub:'Hold more in mind and recall it accurately.',c:'var(--c-mem)',on:'#ffffff'},
  ppl:{name:'People Skills',sub:'Faces, names, emotions and conversation.',c:'var(--c-ppl)',on:'#ffffff'},
  int:{name:'Intelligence',sub:'Working memory and switching between rules.',c:'var(--c-int)',on:'#ffffff'},
  nav:{name:'Navigation',sub:'Rotate, map and find your way.',c:'var(--c-nav)',on:'#ffffff'}
};

/* ---------- the 29 exercises ----------
   Difficulty is read from c.L at the start of EVERY round. Two correct rounds in a row move c.L up one level,
   two misses in a row move it down one (see c.trial in play()). Level 1 = easiest, 9 = hardest. */
const lerp=(c,a,b)=>a+(b-a)*(c.L-1)/8, ilerp=(c,a,b)=>Math.round(lerp(c,a,b)), glerp=(c,a,b)=>Math.round(a*Math.pow(b/a,(c.L-1)/8)), tier=c=>c.L<=3?0:c.L<=6?1:2;
const PACES={relaxed:{n:'Relaxed',f:1.4,d:'40% more time to look and answer. Good for starting out.'},normal:{n:'Normal',f:1,d:'The standard pace.'},challenge:{n:'Challenge',f:.8,d:'Shorter displays and less time to answer.'}};
const pace=c=>{if(c&&c.noPace)return 1;try{return (PACES[store.__meta&&store.__meta.pace]||PACES.normal).f}catch(e){return 1}};
/* timing for a level: a at level 1 down to b at level 9, scaled by the chosen pace */
const tms=(c,a,b)=>Math.round(a*Math.pow(b/a,(c.L-1)/8)*pace(c)), rt=(c,a,b)=>lerp(c,a,b)/Math.sqrt(pace(c));
async function fixate(c,b){const f=put(b,'+',50,50,2.4);f.style.color='var(--mute)';f.style.fontWeight='800';await c.sleep(Math.round(550*pace(c)));f.remove()}
const GAMES=[
/* ===== ATTENTION ===== */
{id:'tracker',cat:'att',name:'Target Tracker',desc:'Some bubbles light up. Then look-alikes join and everything drifts around. When it stops, tap the bubbles you were tracking.',async run(c){
  const N=12,[W,H]=arenaSize(),[v]=lay(c),ar=mk('div','arena');ar.style.width=W+'px';ar.style.height=H+'px';v.append(ar);
  for(let r=0;r<N;r++){const t=Math.min(7,1+Math.ceil(c.L/1.5)),d=ilerp(c,3,8),sp=lerp(c,70,190)/pace(c),dur=lerp(c,2800,5500),show=tms(c,2200,1300);
    ar.replaceChildren();const o=spawnOrbs(ar,t+d,W,H);o.forEach((q,i)=>{q.t=i<t;if(q.t)q.e.classList.add('tgt')});
    c.hint(`Round ${r+1}/${N} · remember these ${t}`);await c.sleep(show);o.forEach(q=>q.e.classList.remove('tgt'));c.hint('Keep your eyes on them…');
    await drift(c,o,W,H,dur,sp);c.hint(`Tap the ${t} you tracked`);let sel=0;
    await new Promise(res=>o.forEach(q=>q.e.onclick=()=>{if(q.s)return;q.s=1;q.e.classList.add('sel');if(++sel===t)res()}));
    o.forEach(q=>{if(q.s)c.tally(q.t)});const ok=o.every(q=>!!q.s===q.t);
    o.forEach(q=>{q.e.onclick=null;q.e.classList.remove('sel');if(q.t)q.e.classList.add('tgt');else if(q.s)q.e.classList.add('no')});flash(c,ok,false);await c.sleep(700)}
  c.finish(`Last round: ${Math.min(7,1+Math.ceil(c.L/1.5))} targets among ${Math.min(7,1+Math.ceil(c.L/1.5))+ilerp(c,3,8)} bubbles`);
}},
{id:'double',cat:'att',name:'Double Decision',desc:'A car flashes in the centre while a road sign flashes at the edge. Pick the car you saw, then tap where the sign was. Each level up flashes faster and adds decoy signs.',async run(c){
  const N=20;
  for(let r=0;r<N;r++){const T=tms(c,600,150),rad=lerp(c,30,44),nd=ilerp(c,0,6);const[v,k]=lay(c),b=mk('div','box');v.append(b);const car=pick(['🚗','🚙']),pos=rnd(8);
    c.hint(`${r+1}/${N} · look at the +`);await fixate(c,b);put(b,car,50,50,2.6);put(b,'🚸',...ringXY(pos,8,rad),1.9);
    shuffle([...Array(8).keys()].filter(i=>i!==pos)).slice(0,nd).forEach(i=>put(b,c.L>=7?pick(['🚧','⚠️','⛔']):'🚧',...ringXY(i,8,rad),1.9));
    await c.show(T);b.replaceChildren();noise(b);await c.sleep(250);b.replaceChildren();
    c.hint('Which car was in the centre?');const pc=await ask(k,['🚗','🚙']);c.hint('Where was the 🚸 sign?');const sp=await tapOne(slots(b,8,rad));
    flash(c,pc===car&&sp===pos);await c.sleep(250)}
  c.finish(`Last flash: ${tms(c,600,150)} ms`);
}},
{id:'divided',cat:'att',name:'Divided Attention',desc:'Two shapes flash. Tap Match only when they follow the rule on screen (same colour, same shape, same fill, or a combination). The rule keeps changing.',async run(c){
  const SH=['circle','square','triangle'],CO=['#e5483d','#2f7de1','#2fa84f'],FI=['solid','striped','empty'];
  const RULES=[['Same colour',(a,b)=>a.c===b.c],['Same shape',(a,b)=>a.s===b.s],['Same fill',(a,b)=>a.f===b.f],['Same colour AND same shape',(a,b)=>a.c===b.c&&a.s===b.s],['Same colour but different shape',(a,b)=>a.c===b.c&&a.s!==b.s]];
  const rs=()=>({s:pick(SH),c:pick(CO),f:pick(FI)});
  const svg=o=>{const fill=o.f==='solid'?o.c:o.f==='empty'?'none':`url(#st${CO.indexOf(o.c)})`;const d={circle:'<circle cx="30" cy="30" r="24"',square:'<rect x="7" y="7" width="46" height="46"',triangle:'<polygon points="30,6 55,53 5,53"'}[o.s];return `<svg viewBox="0 0 60 60" width="90" height="90">${d} fill="${fill}" stroke="${o.c}" stroke-width="4"/></svg>`};
  const N=28;const[v,k]=lay(c);const rule=mk('div','tag');rule.style.fontSize='1rem';const show=mk('div','row');show.style.cssText='min-height:96px;display:flex;gap:14px;justify-content:center';v.append(rule,show);
  const pad=mk('button','pad','Match');k.append(pad);let pressed=false,live=false;pad.onpointerdown=()=>{if(live&&!pressed){pressed=true;pad.classList.add('on')}};
  for(let r=0;r<N;r++){const T=tms(c,1000,300),win=Math.max(T+600,tms(c,1900,1100)),nr=[3,3,3,4,4,4,5,5,5][c.L-1],blk=c.L<=3?7:c.L<=6?5:4;
    const R=RULES[Math.floor(r/blk)%nr];rule.textContent='Rule: '+R[0];c.hint('Tap Match only if the pair follows the rule');
    const a=rs(),want=Math.random()<.5;let b,t=0;do{b=rs()}while(R[1](a,b)!==want&&t++<300);const match=R[1](a,b);
    pressed=false;pad.classList.remove('on');await c.sleep(350);show.innerHTML=svg(a)+svg(b);live=true;await c.show(T);show.innerHTML='';await c.sleep(win-T);live=false;
    flash(c,pressed===match)}
  c.finish(`Last flash: ${tms(c,1000,300)} ms`);
}},
{id:'mixed',cat:'att',name:'Mixed Signals',needsAudio:1,desc:'You see a row of letters and hear one letter. Tap Match only when the letter you hear is the same as the middle letter on screen.',async run(c){
  const N=28;const[v,k]=lay(c);const w=mk('div','big');w.style.letterSpacing='.1em';v.append(w);
  const pad=mk('button','pad','Match');k.append(pad);let pressed=false;pad.onpointerdown=()=>{if(!pressed){pressed=true;pad.classList.add('on')}};

    const mid=pick(L),flank=Math.random()<inc?pick(L.filter(x=>x!==mid)):mid,match=Math.random()<.5,heard=match?mid:pick(L.filter(x=>x!==mid));

{id:'freeze',cat:'att',name:'Freeze Frame',desc:'First you see a target picture. Then pictures stream past. Tap for every picture that is NOT the target, and freeze when the target appears.',async run(c){
  const SETS=[[['⭐',['🍎','🐟','🚲','🌂','🎈','🔑']],['🐱',['🚗','🌵','🍩','📚','⚽']],['🔔',['🍌','🧦','🪁','🌻','🧲']]],
    [['🐱',['🐶','🐰','🦊','🐼','🐻']],['🔺',['🔷','🟢','🟨','⬛','🟣']],['🍎',['🍐','🍊','🍑','🍒','🍋']]],
    [['🔺',['🔻','🔶','🔸','◀️','▶️']],['🐱',['🐯','🦁','🐈','😺','🐆']],['🌕',['🌖','🌔','🌝','🟡','🌓']]]];

      await c.sleep(dur);live=false;w.textContent='';const good=isT?!pressed:pressed;if(!good||isT)flash(c,good);else c.tally(true);await c.sleep(140)}}

}},
/* ===== BRAIN SPEED ===== */
{id:'hawk',cat:'spd',name:'Hawk Eye',desc:'Birds flash around the screen for a split second. One of them is the hawk. Tap where it was. Each level up flashes faster, with more birds and clutter.',async run(c){

{id:'detail',cat:'spd',name:'Eye for Detail',desc:'Arrows flash one after another in different places. Exactly two are identical. Tap the two spots where the identical ones appeared.',async run(c){
  const N=16;
  for(let r=0;r<N;r++){const n=ilerp(c,3,5),delta=lerp(c,40,8),T=tms(c,750,220),rad=lerp(c,22,40);const[v]=lay(c),b=mk('div','box');v.append(b);

    const order=shuffle(angs.map((a,i)=>({a,same:i<2}))),pos=shuffle([...Array(8).keys()]).slice(0,order.length),sl=slots(b,8,rad);sl.forEach((s,i)=>{if(!pos.includes(i))s.style.visibility='hidden'});

{id:'sweeps',cat:'spd',name:'Sound Sweeps',needsAudio:1,desc:'You hear quick sounds that glide up or down in pitch. Report the direction of each one, in order. Each level up plays shorter sweeps, then more of them.',async run(c){

{id:'vsweeps',cat:'spd',name:'Visual Sweeps',desc:'Striped rings move twice, each time either outward or inward. Report the direction of the first move, then the second. Each level up moves faster.',async run(c){
  const N=18,COLS=['#e5483d','#2f7de1','#2fa84f','#e8b800','#8a4fd1'];
  for(let r=0;r<N;r++){const dur=tms(c,900,150);const[v,k]=lay(c),cv=mk('canvas','sw');cv.width=cv.height=300;v.append(cv);const x=cv.getContext('2d'),col=pick(COLS),sp=14+rnd(14);
    const draw=ph=>{x.clearRect(0,0,300,300);x.strokeStyle=col;x.lineWidth=sp/2;for(let rr=((ph%sp)+sp)%sp;rr<150;rr+=sp){x.beginPath();x.arc(150,150,rr,0,6.283);x.stroke()}};

    x.clearRect(0,0,300,300);c.hint('First move?');const a1=await ask(k,['Outward','Inward']);c.hint('Second move?');const a2=await ask(k,['Outward','Inward']);

  c.finish(`Last move: ${tms(c,900,150)} ms`);
}},
{id:'tuning',cat:'spd',name:'Fine Tuning',needsAudio:1,desc:'You hear one word from a pair that sounds alike, like "bee" and "pea". Pick the one you heard. Each level up speaks faster and uses closer pairs.',async run(c){

{id:'mgrid',cat:'mem',name:'Memory Grid',needsAudio:1,desc:'Each card plays a syllable when you turn it over. Find all the pairs. Clear a board in few moves twice in a row and the next board gets bigger.',async run(c){
  const SY=[['ma','so','ki','lu','be','ro','fa','ti','zo','ne'],['ba','so','ki','da','me','ro','fa','ti','go','ne'],['ba','pa','da','ta','ga','ka','ma','na','fa','va']],N=5;

    const sy=shuffle(SY[tier(c)]).slice(0,pairs),cards=shuffle([...sy,...sy]);let open=[],found=0,lock=false,moves=0;

        else{c.tally(false);lock=true;c.after(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='?'});lock=false},800)}}};g.append(b)}));
    flash(c,moves<=limit,false);await c.sleep(500)}

{id:'stacks',cat:'mem',name:'Syllable Stacks',needsAudio:1,desc:'Listen to a series of syllables, then tap them back in the same order. Get it right twice in a row and the next series is one longer.',async run(c){

{id:'todo',cat:'mem',name:'To-Do List Training',needsAudio:1,desc:'Listen to a list of instructions, then carry them out in order by tapping the right objects. Get it right twice in a row and the next list is one step longer.',async run(c){

{id:'mindseye',cat:'mem',name:"Mind's Eye",desc:'A target shape is shown, then hidden. Then find it among look-alikes that differ in colour, shape or tilt. (Built from a short description, so it may differ from the original.)',async run(c){
  const SH=['▲','■','●','◆','★'],CO=['#e5483d','#2f7de1','#2fa84f','#e8b800','#8a4fd1'],RO=[0,20,45,90],N=18;

    v.innerHTML=`<div class="big" style="font-size:6rem">${html(T)}</div>`;c.hint(`${r+1}/${N} · remember this one`);await c.show(view);v.innerHTML='';c.hint('Hold it in mind…');await c.sleep(hold);
    const set=[T];let g=0;while(set.length<n&&g++<500){const d={...T};shuffle(['s','c','r']).slice(0,ch).forEach(k=>{d[k]=pick(k==='s'?SH:k==='c'?CO:RO)});if(set.every(x=>x.s!==d.s||x.c!==d.c||x.r!==d.r))set.push(d)}

{id:'hearhear',cat:'mem',name:'Hear, Hear',needsAudio:1,desc:'Learn a target sound, then listen to a stream of sounds. Tap only when you hear the target. Each level up uses decoys that sound closer to it. (Built from a short description, so it may differ from the original.)',async run(c){

{id:'rhythm',cat:'mem',name:'Rhythm Recall',needsAudio:1,desc:'Hear a short melody and watch its rhythm on screen, then tap the rhythm back on the pad. Get it right twice in a row and the next rhythm has one more note.',async run(c){

/* ---------- analysis: areas, weak spots, suggestions ---------- */
function gstat(g){const e=rec(g),h=e.hist,recent=h.slice(-5),acc=recent.length?Math.round(recent.reduce((a,x)=>a+x.acc,0)/recent.length):null;
  const cleared=Object.values(e.stars).filter(s=>s>0).length,fails=h.length?(e.since||0):0;
  return {g,e,acc,cleared,played:h.length>0,sessions:h.length,stuck:fails>=2,fails,score:acc==null?null:Math.round(.6*acc+.4*(cleared/LEVELS)*100)}}
function areaStats(){return Object.entries(CATS).map(([k,cat])=>{const gs=GAMES.filter(g=>g.cat===k).map(gstat),pl=gs.filter(s=>s.played);
  const score=pl.length?Math.round(pl.reduce((a,s)=>a+s.score,0)/pl.length):null,acc=pl.length?Math.round(pl.reduce((a,s)=>a+s.acc,0)/pl.length):null,lv=pl.length?Math.round(pl.reduce((a,s)=>a+s.e.lv,0)/pl.length):0;
  return {k,cat,gs,pl,score,acc,lv,sessions:pl.reduce((a,s)=>a+s.sessions,0)}})}
function suggestions(){const areas=areaStats(),trained=areas.filter(a=>a.score!=null).sort((a,b)=>a.score-b.score),out=[],used=new Set();
  const add=(s,why,L)=>{if(s&&!used.has(s.g.id)&&out.length<3){used.add(s.g.id);out.push({g:s.g,L:L||s.e.lv,why})}};
  if(trained.length){const w=trained[0],s=w.pl.slice().sort((a,b)=>a.acc-b.acc)[0];add(s,`${w.cat.name} is your weakest area (${w.score}/100). Your recent accuracy here is ${s.acc}%.`)}
  const stuck=GAMES.map(gstat).filter(s=>s.stuck).sort((a,b)=>b.fails-a.fails)[0];
  if(stuck)add(stuck,`No new level in your last ${stuck.fails} sessions. A focused run can break through.`);
  const untrained=areas.filter(a=>a.score==null);
  if(untrained.length){const a=untrained[0];add(a.gs[0],`You haven't trained ${a.cat.name} yet. Start here to add it to your report.`,1)}
  if(trained.length>1){const w=trained[1],s=w.pl.slice().sort((a,b)=>a.acc-b.acc)[0];add(s,`${w.cat.name} is your next weakest area (${w.score}/100).`)}
  areas.forEach(a=>{const s=a.gs.find(x=>!x.played);if(s)add(s,`New in ${a.cat.name}: try it at level 1.`,1)});
  return out}

/* ---------- daily workout ---------- */
function makePlan(){const d=today(),seed=seedOf(d),areas=areaStats(),items=[],used=new Set();
  const add=(s,why)=>{if(s&&!used.has(s.g.id)&&items.length<5){used.add(s.g.id);items.push({id:s.g.id,L:s.e.lv,why})}};
  const weakest=a=>a.gs.slice().sort((x,y)=>(x.acc==null?-1:x.acc)-(y.acc==null?-1:y.acc)||((seed+x.g.id.length)%3)-((seed+y.g.id.length)%3));
  const trained=areas.filter(a=>a.score!=null).sort((a,b)=>a.score-b.score);
  if(trained.length<3){
    const order=areas.slice().sort((a,b)=>(a.score!=null)-(b.score!=null)||((seed>>a.k.length)%5)-((seed>>b.k.length)%5));
    order.forEach(a=>{const s=a.gs.find(x=>!x.played)||weakest(a)[0];add(s,a.score==null?`First look at ${a.cat.name}, so your report can include it.`:`Builds your ${a.cat.name} score.`)});
  }else{
    const w=trained[0];weakest(w).slice(0,2).forEach(s=>add(s,`${w.cat.name} is your weakest area (${w.score}/100).`));
    const w2=trained[1];add(weakest(w2)[0],`${w2.cat.name} is your second weakest area (${w2.score}/100).`);
    add(gstat(G(seed%2?'double':'hawk')),'Speed training. This type has the strongest research behind it.');
    const rest=areas.filter(a=>!items.some(it=>G(it.id).cat===a.k));if(rest.length){const a=rest[seed%rest.length];add(weakest(a)[0],`Keeps ${a.cat.name} in the mix.`)}
    let j=0;while(items.length<5&&j<GAMES.length){add(gstat(GAMES[(seed+j*7)%GAMES.length]),'Keeps your training varied.');j++}
  }
  return {d,items,res:items.map(()=>null)}}
function todayPlan(){const m=meta();if(!m.plan||m.plan.d!==today()){m.plan=makePlan();save()}return m.plan}
const planDone=p=>p.res.filter(r=>r!=null).length;

function weekKeys(n){const s=new Date();s.setDate(s.getDate()-((s.getDay()+6)%7));return [...Array(n)].map((_,i)=>{const d=new Date(s);d.setDate(d.getDate()-7*(n-1-i));return ymd(d)})}

function lineChart(series){const W=340,H=180,pl=34,pr=16,pt=16,pb=28,iw=W-pl-pr,ih=H-pt-pb,n=series.length,x=i=>pl+i*iw/(n-1),y=v=>pt+ih-(v/100)*ih;

  series.forEach((p,i)=>{if(i%2===n%2||i===n-1)grid+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${fmtDay(p.k)}</text>`});
  let path='',prev=null;series.forEach((p,i)=>{if(p.v==null){prev=null;return}path+=(prev==null?'M':'L')+x(i)+' '+y(p.v)+' ';prev=i});

function wireChart(el,series){const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');

function spark(series){const W=96,H=28,n=series.length,x=i=>2+i*(W-4)/(n-1),y=v=>H-3-(v/100)*(H-6);let d='',prev=null;

/* ---------- workout / check step screen ---------- */

  const res=kind==='workout'?todayPlan().res:null;
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Back to home">${CLOSE}</button><h2><small>${kind==='workout'?"Today's workout":'Brain check'}</small>Exercise ${i+1} of ${list.length}</h2></div>
   <div class="intro"><div class="pdots">${list.map((_,j)=>`<i class="${(res?res[j]!=null:j<i)?'ok':j===i?'cur':''}"></i>`).join('')}</div>
    <div class="ihead"><div class="bigic">${icon(g.id,40)}</div><div><p class="eyebrow" style="color:var(--cc)">${cat.name} · Level ${it.L} · ${TIERS[tierOf(it.L)].name}</p><h1>${g.name}</h1></div></div>

   </div><div class="dock"><button class="cta" id="go">Start</button>${kind==='workout'?'<button class="ghost" id="skip">Skip this one</button>':''}</div>`;
  $('#bk').onclick=home;$('#go').onclick=()=>{primeAudio(g);play(g,it.L,{kind,i,n:list.length})};

/* ---------- play ---------- */
function play(g,L,opts){
  opts=opts||{};stopLive();atHome=false;const cat=CATS[g.cat];app.style.cssText=catVars(cat);const adaptive=opts.kind!=='check';
  const lab=()=>opts.kind==='check'?`Brain check ${opts.i+1}/${opts.n} · Level ${c.L}`:`${opts.kind==='workout'?`Workout ${opts.i+1}/${opts.n} · `:''}Level ${c.L} · ${TIERS[tierOf(c.L)].name}`;
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Quit">${CLOSE}</button><h2><small id="lvl"></small>${g.name}</h2><span class="scorepill" id="st"></span></div>
   <div class="ladder" id="ladder" aria-hidden="true">${[...Array(LEVELS)].map((_,i)=>`<i data-l="${i+1}"></i>`).join('')}</div>
   <p id="hint"></p><div id="stage"></div><div class="toast" id="toast" hidden></div>`;
  const timers=new Set();let done=false;
  const c={alive:true,noPace:!adaptive,stage:$('#stage'),L,start:L,peak:L,right:0,wrong:0,run:{ok:0,bad:0},cleared:{},miss:{},
    clear(){timers.forEach(clearTimeout);timers.clear()},
    after(fn,ms){const id=setTimeout(()=>{timers.delete(id);if(c.alive)fn()},ms);timers.add(id);return id},
    sleep(ms){return new Promise(r=>c.after(r,ms))},
    show(ms){return new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>{if(c.alive)c.after(r,ms)})))},
    say(t,rate){return say(t,rate).then(()=>new Promise(r=>{if(c.alive)r()}))},
    tally(ok){ok?c.right++:c.wrong++;const s=$('#st');if(s)s.textContent=`${c.right}/${c.right+c.wrong}`},
    trial(ok){if(!adaptive||!c.alive)return;const cur=c.L;
      if(ok){c.run.bad=0;if(++c.run.ok>=2){c.run.ok=0;const m=c.miss[cur]||0;c.cleared[cur]=Math.max(c.cleared[cur]||0,m===0?3:m===1?2:1);
          if(cur<LEVELS){c.L++;c.peak=Math.max(c.peak,c.L);toast(`Level up! ${cur} → ${c.L}`,true)}else toast('Top level cleared!',true)}}
      else{c.miss[cur]=(c.miss[cur]||0)+1;c.run.ok=0;if(++c.run.bad>=2){c.run.bad=0;if(cur>1){c.L--;toast(`Back to level ${c.L}`,false)}}}
      head()},
    stat(){},
    hint(t){const h=$('#hint');if(h)h.textContent=t},
    timer(sec,cb){c.after(cb,sec*1000)},
    finish(note,accOverride){if(done||!c.alive)return;done=true;c.alive=false;c.clear();
      const tot=c.right+c.wrong,acc=accOverride!=null?accOverride:tot?c.right/tot:0,pct=Math.round(acc*100),pts=Math.round(acc*100*c.peak);
      const e=rec(g),m=meta(),prevLv=e.lv,prevPeak=e.peak||0;e.plays++;e.hist=e.hist.concat({L:c.start,peak:c.peak,acc:pct,d:today()}).slice(-60);
      const gained=[];
      if(opts.kind==='check'){m.check=m.check&&m.check.acc?m.check:{d:today(),acc:{}};m.check.acc[g.cat]=pct;
        if(Object.keys(m.check.acc).length>=CHECK.length){m.checks.push({d:today(),acc:m.check.acc});delete m.check}}
      else{Object.entries(c.cleared).forEach(([l,s])=>{l=+l;if(s>(e.stars[l]||0))gained.push(l);e.stars[l]=Math.max(e.stars[l]||0,s)});
        const top=Math.max(0,...Object.keys(c.cleared).map(Number));e.lv=Math.max(e.lv,Math.min(LEVELS,top+1));e.peak=Math.max(prevPeak,c.peak);
        e.since=e.lv>prevLv?0:(e.since||0)+1;e.best=Math.max(e.best||0,pts);e.acc[c.start]=Math.max(e.acc[c.start]||0,pct);
        if(opts.kind==='workout'){const p=todayPlan();p.res[opts.i]=pct;if(planDone(p)>=p.items.length&&!m.workouts.includes(today())){m.workouts.push(today());try{window.AndroidApp&&window.AndroidApp.markWorkoutDone(today())}catch(err){}}}}
      if(!m.days.includes(today())){m.days.push(today());if(m.days.length>400)m.days.shift()}save();
      result(g,{acc,pct,pts,note,opts,start:c.start,final:c.L,peak:c.peak,cleared:c.cleared,unlocked:e.lv>prevLv?e.lv:0,newPeak:c.peak>prevPeak&&prevPeak>0,gained})}
  };
  function head(){const s=$('#lvl');if(s)s.textContent=lab();$('#ladder').querySelectorAll('i').forEach(i=>{const l=+i.dataset.l;i.className=l<c.L?'done':l===c.L?'cur':''})}
  function toast(t,up){const el=$('#toast');if(!el)return;el.textContent=t;el.className='toast '+(up?'up':'down');el.hidden=false;buzz(up?[15,40,15]:30);clearTimeout(el._t);el._t=setTimeout(()=>{el.hidden=true},1300)}
  live=c;head();$('#bk').onclick=()=>opts.kind?home():intro(g,L);
  (async()=>{for(const n of ['3','2','1']){c.stage.innerHTML=`<div class="count"><span>${n}</span></div>`;await c.sleep(420)}c.stage.innerHTML='';return g.run(c)})()
    .catch(err=>{console.error(err);if(c.alive)c.hint('Something went wrong. Tap ✕ to go back.')});
}

/* ---------- result ---------- */
function result(g,R){
  live=null;const o=R.opts||{},cat=CATS[g.cat],e=rec(g),chk=o.kind==='check';app.style.cssText=catVars(cat);
  const cl=Object.entries(R.cleared).map(([l,s])=>[+l,s]).sort((a,b)=>a[0]-b[0]);
  const msg=chk?`Test ${o.i+1} done`:R.unlocked?`Level ${R.unlocked} unlocked!`:R.peak>R.start?`You climbed to level ${R.peak}`:cl.length?`Level ${R.start} cleared`:'Keep at it';
  const sub=chk?'Brain check results are saved for your monthly comparison.':R.unlocked&&tierOf(R.unlocked)!==tierOf(R.unlocked-1)?`${TIERS[tierOf(R.unlocked)].name} mode is open.`:cl.length?'Two right in a row clears a level. Fewer misses earn more stars.':`Get 2 right in a row to clear level ${R.start}.`;
  const last=o.kind&&o.i+1>=o.n,cont=Math.min(R.final,e.lv);
  const dock=o.kind?`<button class="cta" id="nx">${last?(chk?'See check results':'See workout results'):'Next exercise'}</button><button class="ghost" id="hm">Back to home</button>`
    :`<button class="cta" id="again">Play again from level ${cont}</button><button class="ghost" id="hm">All exercises</button>`;
  app.innerHTML=`<div class="top"><button class="ib" id="x" aria-label="Close">${CLOSE}</button><h2><small>${chk?'Brain check':cat.name}</small>${g.name}</h2></div>
   <div class="res">
    <div class="ring"><b>${chk?R.pct+'%':'Lv '+R.peak}</b><span>${chk?'accuracy':'highest level'}</span></div>
    <h2 class="msg">${msg}</h2><p class="note" style="justify-content:center;text-align:center">${sub}</p>
    ${!chk&&cl.length?`<div class="clr">${cl.map(([l,s])=>`<span class="cchip${R.gained.includes(l)?' new':''}"><b>Lv ${l}</b>${starRow(s)}</span>`).join('')}</div>`:''}
    ${R.note?`<p class="note" style="justify-content:center">${R.note}</p>`:''}
    ${chk?'':`<div class="tiles2" style="width:100%"><div class="tile2"><b>${R.pct}%</b><span>Accuracy</span></div><div class="tile2"><b>+${R.pts}</b><span>Points</span></div></div>`}
   </div><div class="dock">${dock}</div>`;
  $('#hm').onclick=home;$('#x').onclick=()=>o.kind?home():intro(g,cont);
  if($('#again'))$('#again').onclick=()=>play(g,cont);
  if($('#nx'))$('#nx').onclick=()=>{if(chk){const m=meta();stepScreen('check',m.check&&m.check.acc?Object.keys(m.check.acc).length:CHECK.length)}else{const p=todayPlan();stepScreen('workout',p.res.findIndex(r=>r==null))}};
  if(!chk&&(R.unlocked||R.gained.length))confetti();
}
function confetti(){const host=$('.res');if(!host)return;const cf=mk('div','confetti'),cols=['var(--c-att)','var(--c-spd)','var(--c-mem)','var(--c-ppl)','var(--c-int)','var(--c-nav)'];
  for(let i=0;i<36;i++){const p=mk('i');p.style.left=rnd(100)+'%';p.style.background=pick(cols);p.style.animationDelay=(Math.random()*.6)+'s';cf.append(p)}host.append(cf);buzz(30)}

    <section><h3 class="sec-h">Brain check</h3>${ch.length?checkBars(ch):''}<p class="note" style="margin:10px 0">${cs.inProgress?`Check in progress: ${cs.done} of ${CHECK.length} tests done.`:ch.length?(cs.due?'Your monthly re-test is due.':`Next re-test in ${cs.next} day${cs.next===1?'':'s'}.`):'Take a baseline test now, then re-test every month to measure real change.'}</p>
      <button class="ghost" id="chk">${cs.inProgress?'Continue brain check':ch.length?(cs.due?'Take the re-test':'Take a check now'):'Take your baseline test'}</button></section>
    ${weak.length?`<section><h3 class="sec-h">Weak spots</h3><div class="weak">${weak.map(s=>`<div class="wrow" style="${catVars(CATS[s.g.cat])}"><span class="gic2">${icon(s.g.id,22)}</span>
      <span class="wtx"><b>${s.g.name}</b><span>${s.stuck?`No new level in ${s.fails} sessions`:`Level ${s.e.lv}`} · recent accuracy ${s.acc}%</span></span></div>`).join('')}</div></section>`:''}
    <section><h3 class="sec-h">Suggested for you</h3><div class="sugg">${sugg.map((s,i)=>`<div class="srow" style="${catVars(CATS[s.g.cat])}"><div class="shead"><span class="gic2">${icon(s.g.id,22)}</span>
      <span class="wtx"><b>${s.g.name}</b><span>${CATS[s.g.cat].name} · Level ${s.L}</span></span><button class="sgo" data-i="${i}">Play</button></div><p>${s.why}</p></div>`).join('')}</div></section>
    <p class="note">Area scores combine your accuracy over the last five sessions of each exercise (60%) with how many levels you've cleared (40%).</p>
   </div>`;
  $('#bk').onclick=home;$('#chk').onclick=startCheck;app.querySelectorAll('.sgo').forEach(b=>b.onclick=()=>{const s=sugg[+b.dataset.i];primeAudio(s.g);play(s.g,s.L)});
  const chEl=app.querySelector('.chart');if(chEl)wireChart(chEl,wk);
}

/* ---------- settings: game pace + daily reminder ---------- */
function settings(){
  stopLive();atHome=false;app.removeAttribute('style');const M=meta(),A=window.AndroidApp;let on=false,h=19,mi=0;
  try{const r=A.getReminder().split(',');on=r[0]==='1';h=+r[1];mi=+r[2]}catch(e){}
  const pad=n=>String(n).padStart(2,'0'),cur=PACES[M.pace]?M.pace:'normal';
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Back">${BACK}</button><h2><small>Settings</small>Mind Gym</h2></div>
   <div class="intro">
    <section><h3 class="sec-h">Game pace</h3><p class="note" style="margin:-4px 0 12px">Sets how long pictures stay on screen and how much time you get to answer, at every level. Brain checks always use Normal so your results stay comparable.</p>
     <div class="paces">${Object.entries(PACES).map(([k,p])=>`<button class="pace${k===cur?' sel':''}" data-k="${k}" aria-pressed="${k===cur}"><b>${p.n}</b><span>${p.d}</span></button>`).join('')}</div></section>
    ${A?`<section><h3 class="sec-h">Daily reminder</h3><div style="display:flex;flex-direction:column;gap:10px">
     <label class="toggle" for="ron"><span><b>Remind me every day</b><em>Skipped on days you've already done your workout</em></span><input type="checkbox" id="ron" ${on?'checked':''}><i></i></label>
     <label class="field" for="rt"><b>Time</b><input type="time" id="rt" value="${pad(h)}:${pad(mi)}"></label>
     <button class="ghost" id="sv">Save reminder</button><p class="note" id="rst"></p></div></section>`:'<p class="note">Daily reminders are available in the Android app.</p>'}
   </div>`;
  $('#bk').onclick=home;
  app.querySelectorAll('.pace').forEach(b=>b.onclick=()=>{M.pace=b.dataset.k;save();app.querySelectorAll('.pace').forEach(x=>{x.classList.toggle('sel',x===b);x.setAttribute('aria-pressed',x===b)})});
  if(A)$('#sv').onclick=()=>{const v=($('#rt').value||'19:00').split(':'),onv=$('#ron').checked;let ok=true;
    try{A.setReminder(onv,+v[0],+v[1]);ok=A.notificationsAllowed()}catch(e){}
    $('#rst').textContent=onv?(ok?`Saved. You'll be reminded every day at ${pad(+v[0])}:${pad(+v[1])}.`:'Saved, but notifications are blocked. Allow notifications for Mind Gym when your phone asks, or in Settings → Apps → Mind Gym → Notifications.'):'Saved. Reminders are off.'};
}
home();
</script>
