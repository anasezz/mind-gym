<title>Mind Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app. Home lists the 29 exercises by training area; an exercise fills the screen with a thin timer bar on top. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --ink:#13201e; --mute:#5b6d69; --line:#d3dedb;
  --accent:#0e8575; --good:#1f9d55; --bad:#d64545;
  --c-att:#d0561c; --c-spd:#a87a00; --c-mem:#2f65cf; --c-ppl:#c4376f; --c-int:#7c43c4; --c-nav:#00798c;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#17231f; --ink:#e6f0ed; --mute:#8fa59f; --line:#2b3d36;
  --accent:#2fc4ae; --good:#4cd081; --bad:#f2706e;
  --c-att:#f08a55; --c-spd:#e5b53a; --c-mem:#6d9cf0; --c-ppl:#ee74a6; --c-int:#b58af0; --c-nav:#4cc3d9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#17231f; --ink:#e6f0ed; --mute:#8fa59f; --line:#2b3d36;
  --accent:#2fc4ae; --good:#4cd081; --bad:#f2706e;
  --c-att:#f08a55; --c-spd:#e5b53a; --c-mem:#6d9cf0; --c-ppl:#ee74a6; --c-int:#b58af0; --c-nav:#4cc3d9; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:12px 16px;min-height:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.scroll{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:24px;padding-bottom:8px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.head h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.head p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
.badge{font-variant-numeric:tabular-nums;text-align:right;font-size:.8rem;color:var(--mute);line-height:1.3}
.badge b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}
.cat h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--cc);margin-bottom:4px}
.cat p.sub{margin:0 0 10px;color:var(--mute);font-size:.88rem}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:100px}
.tile:active{transform:scale(.98)}
.tile b{font-family:var(--f-display);font-size:1.02rem}
.tile span{font-size:.8rem;color:var(--mute);flex:1}
.tile i{font-style:normal;font-size:.78rem;font-weight:700;color:var(--cc);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:10px}
.top h2{flex:1;font-size:1.15rem;font-weight:800;min-width:0}
.top #st{font-family:var(--f-display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--cc)}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;line-height:1;flex:none}
#bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 6px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:var(--cc);transform-origin:left}
#hint{margin:0 0 8px;color:var(--mute);font-size:.95rem;min-height:1.4em;text-align:center}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
#v{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:10px}
#k{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;align-items:center}
.intro h1{font-size:2.1rem;font-weight:800;color:var(--cc)}
.intro p{margin:0;max-width:36ch;color:var(--mute);line-height:1.5}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cc)}
.cta{background:var(--cc);color:var(--bg);border:0;border-radius:16px;font-weight:700;font-size:1.1rem;padding:15px 36px;font-family:var(--f-display)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:16px;padding:13px 28px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.score{font-family:var(--f-display);font-weight:800;font-size:5rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--cc)}
.btn{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;padding:0 12px}
.btn:active{background:var(--line)}
.btn.on{background:var(--cc);color:var(--bg);border-color:var(--cc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,14vw,5rem);line-height:1.1;text-align:center}
.pad{width:100%;min-height:96px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:1.5rem}
.pad:active{background:var(--cc);color:var(--bg)}
.box{position:relative;width:min(100%,340px);aspect-ratio:1;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.box>*{position:absolute;transform:translate(-50%,-50%);line-height:1}
.box>.noise{inset:0;width:100%;height:100%;transform:none;image-rendering:pixelated}
.slot{width:46px;height:46px;border-radius:50%;border:2px dashed var(--mute);background:transparent;padding:0}
.slot.lit{background:var(--cc);border-style:solid;border-color:var(--cc)}
.slot.ok{background:var(--good);border-color:var(--good);border-style:solid}
.slot.no{background:var(--bad);border-color:var(--bad);border-style:solid}
.arena{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;touch-action:none;max-width:100%}
.orb{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--c-att);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:var(--bg);cursor:pointer}
.orb.tgt{box-shadow:0 0 0 5px var(--good)}.orb.sel{box-shadow:0 0 0 5px var(--ink)}.orb.no{background:var(--bad)}
.g{display:grid;gap:8px;width:min(100%,340px)}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.8rem}
.cell.lit{background:var(--cc);border-color:var(--cc)}.cell.ok{background:var(--good);border-color:var(--good)}.cell.no{background:var(--bad);border-color:var(--bad)}
.mcard{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--cc);font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;color:var(--bg)}
.mcard.up{background:var(--surface);color:var(--ink)}.mcard.done{background:var(--surface);color:var(--ink);opacity:.4}
.card{width:120px;height:170px;border-radius:14px;border:1px solid var(--line);background:#fffdf8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:2.6rem;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.card small{font-size:2.2rem}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,360px)}
.faces button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px;display:flex;justify-content:center}
.faces button svg{width:100%;height:auto}
.road{position:relative;width:100%;height:min(52vh,380px);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.road>div{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:pointer}
canvas.sw{width:min(100%,300px);aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.rt{display:flex;gap:16px;justify-content:center}
.rt div{width:130px;height:130px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:18px;background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:5rem}
.rhy{position:relative;width:min(100%,340px);height:40px;border-bottom:2px solid var(--line)}
.rhy b{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%;background:var(--cc);transform:translateX(-50%)}
.rhy b.u{background:var(--ink);bottom:24px;width:10px;height:10px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.5;max-width:40ch}
.fb{position:absolute;inset:0;pointer-events:none;border-radius:20px;opacity:0;transition:opacity .25s;z-index:5}
.fb.good{background:var(--good)}.fb.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="st0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#e5483d"/></pattern>
<pattern id="st1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#2f7de1"/></pattern>
<pattern id="st2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#2fa84f"/></pattern>
</defs></svg>
<script>
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
let store={};try{store=JSON.parse(localStorage.getItem('mindgym2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mindgym2',JSON.stringify(store))}catch(e){}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- sound ---------- */
let actx=null;
function AC(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A()}if(actx.state==='suspended')actx.resume();return actx}
function tone(f1,f2,ms,vol=.22,type='sine'){const a=AC();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+ms/1000);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);
  g.gain.setValueAtTime(vol,t+Math.max(.006,ms/1000-.01));g.gain.linearRampToValueAtTime(0,t+ms/1000);o.connect(g).connect(a.destination);o.start(t);o.stop(t+ms/1000+.02)}
const NATIVE=typeof window.AndroidTTS!=='undefined';
const hasSpeech=NATIVE||('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window);
const ttsWait={};let ttsN=0;window.__ttsDone=id=>{const f=ttsWait[id];if(f){delete ttsWait[id];f()}};
function say(t,rate=1){return new Promise(res=>{if(!hasSpeech){res();return}let done=false;const fin=()=>{if(!done){done=true;res()}};
  if(NATIVE){const id='u'+(++ttsN);ttsWait[id]=fin;try{window.AndroidTTS.speak(t,rate,id)}catch(e){fin()}}
  else{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}}
  setTimeout(fin,1500+t.length*120/rate)})}
function hush(){try{if(NATIVE)window.AndroidTTS.stop();else if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}

/* ---------- shared helpers ---------- */
const stair=(start,min,max,f=.85)=>{let v=start,ok=0;return{get v(){return Math.round(v)},hit(){if(++ok>=2){ok=0;v=Math.max(min,v*f)}},miss(){ok=0;v=Math.min(max,v/f)}}};
function options(el,labels,cb,cls='grid2'){const w=mk('div',cls);labels.forEach(l=>{const b=mk('button','btn',l);b.onclick=()=>cb(l,b);w.append(b)});el.append(w);return w}
const ask=(k,labels,cls)=>new Promise(res=>{k.replaceChildren();options(k,labels,l=>{k.replaceChildren();res(l)},cls)});
function flash(c,ok){const f=$('.fb',c.stage);if(f){f.className='fb '+(ok?'good':'bad');f.style.opacity=.28;setTimeout(()=>{f.style.opacity=0},170)}buzz(ok?10:40)}
function lay(c){c.stage.innerHTML='<div class="fb"></div><div id="v"></div><div id="k"></div>';return[$('#v',c.stage),$('#k',c.stage)]}
function keypad(el,onKey,okLabel='✓'){const k=mk('div','grid3');k.style.width='min(100%,320px)';
  ['1','2','3','4','5','6','7','8','9','⌫','0',okLabel].forEach(x=>{const b=mk('button','btn',x);b.onclick=()=>onKey(x===okLabel?'ok':x==='⌫'?'del':x);k.append(b)});el.append(k);return k}
const ringXY=(i,n,r,off=-Math.PI/2)=>{const a=i/n*Math.PI*2+off;return[50+r*Math.cos(a),50+r*Math.sin(a)]};
function put(b,html,x,y,fs=2,rot=0){const e=mk('div');e.innerHTML=html;e.style.left=x+'%';e.style.top=y+'%';e.style.fontSize=fs+'rem';if(rot)e.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;b.append(e);return e}
function noise(b){const cv=mk('canvas','noise');cv.width=cv.height=72;const x=cv.getContext('2d'),d=x.createImageData(72,72);
  for(let i=0;i<d.data.length;i+=4){const v=rnd(256);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);b.append(cv);return cv}
function slots(b,n,r){return [...Array(n)].map((_,i)=>{const[x,y]=ringXY(i,n,r);const s=mk('button','slot');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label','Position '+(i+1));b.append(s);return s})}
const tapOne=els=>new Promise(res=>els.forEach((e,i)=>e.onclick=()=>{els.forEach(x=>x.onclick=null);res(i)}));
function scatter(n,minD,pad=10){const p=[];let g=0;while(p.length<n&&g++<3000){const x=pad+Math.random()*(100-2*pad),y=pad+Math.random()*(100-2*pad);if(p.every(q=>Math.hypot(q[0]-x,q[1]-y)>minD))p.push([x,y])}return p}
const arenaSize=()=>[Math.min(innerWidth-32,480),Math.max(240,Math.min(innerHeight-300,420))];
function spawnOrbs(ar,n,W,H){const o=[];const pos=scatter(n,14,6);for(let i=0;i<n;i++){const e=mk('div','orb');ar.append(e);
  const q={e,x:(pos[i]?pos[i][0]:rnd(90))/100*(W-40),y:(pos[i]?pos[i][1]:rnd(90))/100*(H-40),a:Math.random()*6.283};e.style.left=q.x+'px';e.style.top=q.y+'px';o.push(q)}return o}
function drift(c,o,W,H,ms,sp){return new Promise(res=>{let last=performance.now();const end=last+ms;const f=t=>{if(!c.alive)return;const dt=Math.min(50,Math.max(0,t-last))/1000;last=t;
  o.forEach(q=>{q.x+=Math.cos(q.a)*sp*dt;q.y+=Math.sin(q.a)*sp*dt;
    if(q.x<0||q.x>W-40){q.a=Math.PI-q.a;q.x=Math.max(0,Math.min(W-40,q.x))}
    if(q.y<0||q.y>H-40){q.a=-q.a;q.y=Math.max(0,Math.min(H-40,q.y))}
    if(Math.random()<.015)q.a+=(Math.random()-.5)*1.2;q.e.style.left=q.x+'px';q.e.style.top=q.y+'px'});
  if(t<end)requestAnimationFrame(f);else res()};requestAnimationFrame(f)})}
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];

/* ---------- faces (drawn, not photos) ---------- */
const SK=['#f3d2b3','#e0ac81','#c68642','#8d5524','#f6dcc6','#d9a066'],HC=['#2b1b12','#6a3b1a','#b5651d','#d8b25c','#8a8a8a','#111111','#a23b1c'];
function rface(){return{skin:pick(SK),hair:pick(HC),hs:rnd(4),ew:11+rnd(8),es:3+rnd(3),nose:rnd(3),rx:27+rnd(9),gl:rnd(4)===0,mu:rnd(5)===0}}
function varyFace(p,n){const q={...p};shuffle(['skin','hair','hs','ew','nose','rx','gl','mu','es']).slice(0,n).forEach(k=>{let t=0;do{q[k]=rface()[k]}while(q[k]===p[k]&&t++<30)});return q}
const EMO={happy:[0,0,'smile'],sad:[-7,1,'frown'],angry:[8,-2,'tight'],surprised:[0,7,'o'],afraid:[-6,6,'wave'],disgusted:[6,-1,'sneer'],neutral:[0,0,'flat'],contempt:[2,0,'smirk'],tired:[0,-3,'flat'],proud:[-1,2,'smile2'],confused:[5,3,'tilt']};
function faceSVG(p,emo='neutral',k=1,shift=0){const E=EMO[emo]||EMO.neutral,tilt=E[0]*k,raise=E[1]*k,m=E[2],sq=1-Math.abs(shift)*.28,ey=54,ex=p.ew;
  const back=p.hs===1?`<ellipse cx="50" cy="70" rx="${p.rx+7}" ry="46" fill="${p.hair}"/>`:'';
  const cap=p.hs===2?'':p.hs===3?[...Array(9)].map((_,i)=>`<circle cx="${50-p.rx+i*p.rx/4}" cy="${30+Math.abs(i-4)*3}" r="9" fill="${p.hair}"/>`).join(''):`<path d="M${48-p.rx} 56 Q50 6 ${52+p.rx} 56 Q50 32 ${48-p.rx} 56Z" fill="${p.hair}"/>`;
  const lid=emo==='tired'?`<path d="M${50-ex-6} ${ey} h12 M${50+ex-6} ${ey} h12" stroke="${p.skin}" stroke-width="5"/>`:'';
  const er=p.es+Math.max(0,raise)*.25;
  const eyes=[50-ex,50+ex].map(x=>`<ellipse cx="${x}" cy="${ey}" rx="${er+2.5}" ry="${er+1.5}" fill="#fff"/><circle cx="${x+shift*2}" cy="${ey}" r="${er-.5}" fill="#1d1d1d"/>`).join('');
  const by=ey-11-raise*.9;
  const brows=`<path d="M${50-ex-8} ${by} L${50-ex+7} ${by+tilt*.6}" stroke="#2a1d16" stroke-width="2.6" stroke-linecap="round"/><path d="M${50+ex-7} ${by+tilt*.6+(emo==='confused'?-5*k:0)} L${50+ex+8} ${by}" stroke="#2a1d16" stroke-width="2.6" stroke-linecap="round"/>`;
  const ny=66+p.nose*3,nose=`<path d="M50 ${ny-10} L47 ${ny} L53 ${ny}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.8" stroke-linejoin="round"/>`;
  const my=86,M={smile:`M39 ${my} Q50 ${my+14*k} 61 ${my}`,smile2:`M42 ${my+1} Q50 ${my+7*k} 58 ${my+1}`,frown:`M40 ${my+5} Q50 ${my+5-12*k} 60 ${my+5}`,tight:`M42 ${my+3} Q50 ${my+3-4*k} 58 ${my+3}`,
    wave:`M40 ${my+3} Q45 ${my+3-5*k} 50 ${my+3} T60 ${my+3}`,sneer:`M40 ${my+3} Q48 ${my+3} 60 ${my-4*k}`,flat:`M42 ${my+2} L58 ${my+2}`,smirk:`M42 ${my+2} Q52 ${my+2} 59 ${my-3*k}`,tilt:`M42 ${my+3} L58 ${my+3-4*k}`};
  const mouth=m==='o'?`<ellipse cx="50" cy="${my+3}" rx="${4+2*k}" ry="${3+6*k}" fill="#5a1f1f"/>`:`<path d="${M[m]}" fill="none" stroke="#7a2b2b" stroke-width="3" stroke-linecap="round"/>`;
  const mu=p.mu?`<path d="M41 ${my-5} Q50 ${my-10} 59 ${my-5}" stroke="${p.hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`:'';
  const gl=p.gl?`<g fill="none" stroke="#333" stroke-width="2"><circle cx="${50-ex}" cy="${ey}" r="${p.es+6}"/><circle cx="${50+ex}" cy="${ey}" r="${p.es+6}"/><path d="M${50-ex+p.es+6} ${ey} L${50+ex-p.es-6} ${ey}"/></g>`:'';
  return `<svg viewBox="0 0 100 120" width="96" height="115" aria-hidden="true">${back}<ellipse cx="50" cy="64" rx="${p.rx}" ry="40" fill="${p.skin}"/>${cap}<g transform="translate(${shift*14} 0) translate(50 0) scale(${sq} 1) translate(-50 0)">${eyes}${lid}${brows}${nose}${mu}${mouth}${gl}</g></svg>`}

const CATS={

{id:'divided',cat:'att',name:'Divided Attention',desc:'Two shapes flash. Tap Match only when they follow the rule on screen (same colour, same shape, same fill, or a combination). The rule keeps changing.',async run(c){

{id:'sweeps',cat:'spd',name:'Sound Sweeps',needsAudio:1,desc:'You hear two quick sounds. Each one glides up or down in pitch. Report the direction of the first, then the second. The sounds get shorter as you improve.',async run(c){

{id:'vsweeps',cat:'spd',name:'Visual Sweeps',desc:'Striped rings move twice, each time either outward or inward. Report the direction of the first move, then the second. The moves get faster as you improve.',async run(c){

{id:'tuning',cat:'spd',name:'Fine Tuning',needsAudio:1,desc:'You hear one word from a pair that sounds alike, like "bee" and "pea". Pick the one you heard. Speech starts slow and speeds up as you improve.',async run(c){

/* ===== MEMORY ===== */
{id:'scene',cat:'mem',name:'Scene Crasher',desc:'A scene of objects flashes, then static wipes it. The scene comes back with one extra object. Tap the new one.',async run(c){

{id:'mentalmap',cat:'nav',name:'Mental Map',desc:'Memorise where objects sit on a grid. The grid is then rotated, flipped or shifted. Rebuild it from memory in its new position.',async run(c){

{id:'opticflow',cat:'nav',name:'Optic Flow',desc:'You are driving. Vehicles and roadside objects come toward you. Tap the one that matches the target before it passes. The road gets busier and faster.',async run(c){
  const IT=['🚗','🚚','🚌','🛵','🚲','🐄','🌳','⛽','🚜','🏍️'],SC=[['#e9c98f','#c9a66b'],['#bfe0a5','#8fbf7a'],['#b9c3cf','#8995a3']];const T=stair(4200,1400,6000,.9);let ok=0;
  for(let r=0;r<18;r++){const[v,k]=lay(c),sc=SC[Math.min(2,Math.floor(r/6))],road=mk('div','road');road.style.background=`linear-gradient(${sc[0]} 0 35%,${sc[1]} 35%)`;
    road.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><polygon points="47,35 53,35 95,100 5,100" fill="#555"/><polygon points="49.6,35 50.4,35 51.5,100 48.5,100" fill="#eee"/></svg>';v.append(road);
    const target=pick(IT),batch=shuffle([target,...shuffle(IT.filter(x=>x!==target)).slice(0,3+Math.min(2,Math.floor(r/6)))]),lanes=shuffle([-1,-.55,-.15,.25,.6,1]).slice(0,batch.length);
    c.hint('Tap the '+target);const els=batch.map((e,i)=>{const d=mk('div');d.textContent=e;road.append(d);return{d,e,l:lanes[i],delay:Math.random()*.25}});
    const res=await new Promise(done=>{let fin=false;els.forEach(o=>o.d.onpointerdown=()=>{if(!fin){fin=true;done(o.e===target)}});const t0=performance.now();
      const f=t=>{if(!c.alive||fin)return;const p=(t-t0)/T.v;els.forEach(o=>{const q=Math.max(0,Math.min(1,(p-o.delay)/(1-o.delay)));const y=35+q*q*70,x=50+o.l*q*q*55;o.d.style.top=y+'%';o.d.style.left=x+'%';o.d.style.fontSize=(.5+q*q*3.6)+'rem';o.d.style.opacity=q>0?1:0});
        if(p>=1.05){fin=true;done(false)}else requestAnimationFrame(f)};requestAnimationFrame(f)});
    res?(ok++,T.hit()):T.miss();flash(c,res);c.stat(ok);await c.sleep(500)}
  c.finish(ok*10,'Fastest approach: '+(T.v/1000).toFixed(1)+' s');
}}
];

/* ---------- screens ---------- */
const app=$('#app');
let live=null;
function total(){return Object.values(store).reduce((a,g)=>a+(g.plays||0),0)}
function stopLive(){if(live){live.alive=false;live.clear();live=null}hush()}
let atHome=true;window.__back=()=>{if(atHome)return false;home();return true};
function home(){
  stopLive();atHome=true;app.style.removeProperty('--cc');
  app.innerHTML=`<div class="scroll"><div class="head"><div><h1>Mind Gym</h1><p>${GAMES.length} exercises in six training areas</p></div>
    <div class="badge"><b>${total()}</b>sessions played</div></div></div>`;
  const sc=$('.scroll',app);
  Object.entries(CATS).forEach(([k,cat])=>{
    const sec=mk('section','cat');sec.style.setProperty('--cc',cat.c);
    sec.innerHTML=`<h3>${cat.name}</h3><p class="sub">${cat.sub}</p>`;const t=mk('div','tiles');
    GAMES.filter(g=>g.cat===k).forEach(g=>{const b=mk('button','tile');const best=store[g.id]?.best;
      b.innerHTML=`<b>${g.name}</b><span>${g.needsAudio?'🔊 Sound on · ':''}${g.desc.split('. ')[0].replace(/\.$/,'')}.</span><i>${best!=null?'Best '+best:'Not played yet'}</i>`;b.onclick=()=>intro(g);t.append(b)});
    sec.append(t);sc.append(sec)});
}
function intro(g){
  atHome=false;const cat=CATS[g.cat];app.style.setProperty('--cc',cat.c);
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Back">‹</button><h2>${cat.name}</h2></div>
   <div class="intro"><span class="tag">${cat.name}</span><h1>${g.name}</h1><p>${g.desc}</p>${g.needsAudio?'<p><b>Turn your sound on.</b></p>':''}
   <p>${store[g.id]?.best!=null?'Your best: <b>'+store[g.id].best+'</b>':'First time here. Good luck.'}</p>
   <button class="cta" id="go">Start</button></div>`;
  $('#bk').onclick=home;$('#go').onclick=()=>{AC();if(!NATIVE&&hasSpeech&&g.needsAudio){try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}}play(g)};
}
function play(g){
  stopLive();atHome=false;const cat=CATS[g.cat];app.style.setProperty('--cc',cat.c);
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Quit">✕</button><h2>${g.name}</h2><span id="st"></span></div>
   <div id="bar"><i></i></div><p id="hint"></p><div id="stage"></div>`;
  const timers=new Set();let done=false;
  const c={alive:true,stage:$('#stage'),
    clear(){timers.forEach(clearTimeout);timers.clear()},
    after(fn,ms){const id=setTimeout(()=>{timers.delete(id);if(c.alive)fn()},ms);timers.add(id);return id},
    sleep(ms){return new Promise(r=>c.after(r,ms))},
    say(t,rate){return say(t,rate).then(()=>new Promise(r=>{if(c.alive)r()}))},
    stat(t){const s=$('#st');if(s)s.textContent=t},
    hint(t){const h=$('#hint');if(h)h.textContent=t},
    timer(sec,cb){const i=$('#bar i');i.style.transition=`transform ${sec}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.transform='scaleX(0)'}));c.after(cb,sec*1000)},
    finish(score,note){if(done||!c.alive)return;done=true;c.alive=false;c.clear();score=Math.max(0,Math.round(score));
      const e=store[g.id]||(store[g.id]={plays:0});const isBest=e.best==null||score>e.best;if(isBest)e.best=score;e.plays++;save();result(g,score,note,isBest)}
  };
  live=c;$('#bk').onclick=home;c.stat('');
  Promise.resolve().then(()=>g.run(c)).catch(err=>{console.error(err);if(c.alive){c.hint('Something went wrong. Tap ✕ to go back.')}});
}
function result(g,score,note,isBest){
  live=null;app.innerHTML=`<div class="intro"><span class="tag">${g.name}</span>
   <div class="score">${score}</div><p>${isBest?'<b style="color:var(--cc)">New personal best!</b>':'Your best: <b>'+store[g.id].best+'</b>'}</p>${note?'<p>'+note+'</p>':''}
   <div class="row"><button class="cta" id="again">Play again</button><button class="ghost" id="hm">All exercises</button></div></div>`;
  $('#again').onclick=()=>play(g);$('#hm').onclick=home;
}
home();
</script>
