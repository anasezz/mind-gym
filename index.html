<title>Mind Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first game library. Home = stats header, today's pick, one swipeable rail of colour cards per training area.
   Exercise screens: chunky header with score pill, big centred play area, pressable 3D buttons. */
:root{
  --bg:#f4f2fb; --surface:#ffffff; --ink:#1c1836; --mute:#6b6688; --line:#e2def0;
  --good:#16a34a; --bad:#e11d48; --accent:#7445d6; --cc:var(--accent); --on:#ffffff;
  --c-att:#e04e30; --c-spd:#f2a516; --c-mem:#3366ee; --c-ppl:#d63384; --c-int:#7445d6; --c-nav:#0d9488;
  --t1:#16a34a; --t2:#d97706; --t3:#e11d48;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14112a; --surface:#201c3b; --ink:#f1effa; --mute:#a39fc0; --line:#352f5a;
  --good:#34d399; --bad:#fb7185; --accent:#9b7bf0; --t1:#22c55e; --t2:#f59e0b; --t3:#f43f5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14112a; --surface:#201c3b; --ink:#f1effa; --mute:#a39fc0; --line:#352f5a;
  --good:#34d399; --bad:#fb7185; --accent:#9b7bf0; --t1:#22c55e; --t2:#f59e0b; --t3:#f43f5e; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--cc);outline-offset:3px}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-block:14px 18px;min-height:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;display:flex;flex-direction:column;gap:26px;padding-bottom:12px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex-shrink:0}
.eyebrow{margin:0;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* home */
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}
.home-head h1{font-size:2.2rem;font-weight:800;line-height:1;margin-top:4px;white-space:nowrap}
.stats{display:flex;gap:8px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:7px 10px;text-align:center;min-width:66px;box-shadow:0 3px 0 var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:1.3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.66rem;color:var(--mute);font-weight:700}
.pick{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;background:var(--cc);color:var(--on);border-radius:26px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.22);position:relative;overflow:hidden;transition:transform .08s}
.pick-ic{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;position:relative}
.pick-tx{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.pick-tx .eyebrow{color:inherit;opacity:.85}
.pick-tx b{font-family:var(--f-display);font-size:1.5rem;line-height:1.1}
.pick-tx em{font-style:normal;font-size:.88rem;opacity:.92;line-height:1.35}
.pick .play{grid-column:1/-1;justify-self:start;background:var(--on);color:var(--cc);font-weight:800;font-family:var(--f-display);padding:10px 22px;border-radius:999px;position:relative}
.bgi{position:absolute;right:-22px;bottom:-26px;opacity:.15;transform:rotate(-12deg);pointer-events:none}
.cat-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cat-h h3{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:8px}
.cat-h h3 i{width:12px;height:12px;border-radius:4px;background:var(--cc);display:inline-block}
.cat-h span{font-size:.78rem;color:var(--mute);font-weight:700}
.sub{margin:3px 0 12px;color:var(--mute);font-size:.88rem}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.gcard{flex:0 0 146px;height:170px;scroll-snap-align:start;border-radius:24px;background:var(--cc);color:var(--on);text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .08s}
.gcard:active,.pick:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.gcard .gic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;position:relative}
.gcard b{font-family:var(--f-display);font-size:1.08rem;line-height:1.15;position:relative}
.gcard .meta{display:flex;gap:6px;align-items:center;position:relative}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.26);padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums}

/* exercise chrome */
.top{display:flex;align-items:center;gap:12px}
.top h2{flex:1;font-size:1.12rem;font-weight:800;min-width:0;line-height:1.15}
.top h2 small{display:block;font-family:var(--f-body);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cc);margin-bottom:2px}
.ib{width:46px;height:46px;border-radius:15px;border:2px solid var(--line);background:var(--surface);flex:none;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.scorepill{font-family:var(--f-display);font-weight:800;font-size:1.02rem;font-variant-numeric:tabular-nums;background:var(--cc);color:var(--on);padding:8px 14px;border-radius:999px;min-width:46px;text-align:center;white-space:nowrap}
.scorepill:empty{display:none}
.intro{flex:1;display:flex;flex-direction:column;gap:20px;overflow-y:auto;padding:22px 2px 8px;min-height:0}
.bigic{width:92px;height:92px;border-radius:28px;background:var(--cc);color:var(--on);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.22);flex:none}
.intro h1{font-size:2.3rem;font-weight:800;line-height:1.05}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--cc);color:var(--on);font-family:var(--f-display);font-weight:800;display:flex;align-items:center;justify-content:center}
.note{margin:0;font-size:.88rem;color:var(--mute);display:flex;gap:8px;align-items:center;line-height:1.4}
.note svg{flex:none;color:var(--cc)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile2{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--line);text-align:left}
.tile2 b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.15}
.tile2 span{font-size:.78rem;color:var(--mute);font-weight:700}
.dock{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.cta{width:100%;background:var(--cc);color:var(--on);border-radius:20px;font-weight:800;font-size:1.2rem;padding:17px 24px;font-family:var(--f-display);box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .06s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ghost{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:15px 24px;font-weight:800;font-family:var(--f-display);font-size:1.05rem;box-shadow:0 4px 0 var(--line)}
.ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#hint{margin:16px 0 6px;color:var(--ink);font-weight:700;font-size:1.04rem;min-height:1.5em;text-align:center;text-wrap:balance}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
#v{width:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px}
#k{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:8rem;color:var(--cc);z-index:6}
.count span{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.7);opacity:0}to{transform:scale(1);opacity:1}}

/* results */
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative;overflow:hidden;min-height:0}
.stars{display:flex;gap:6px;align-items:flex-end}
.stars svg{width:42px;height:42px}
.stars svg:nth-child(2){width:54px;height:54px}
.ring{width:180px;height:180px;border-radius:50%;border:12px solid var(--cc);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.ring b{font-family:var(--f-display);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.ring span{font-size:.72rem;color:var(--mute);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.msg{font-size:1.6rem;font-weight:800}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}

/* game pieces */
.btn{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;padding:0 12px;box-shadow:0 4px 0 var(--line);font-family:var(--f-display);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.on{background:var(--cc);color:var(--on);border-color:var(--cc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,14vw,5rem);line-height:1.1;text-align:center}
.pad{width:100%;min-height:104px;border-radius:24px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:1.6rem;box-shadow:0 6px 0 var(--line)}
.pad:active,.pad.on{background:var(--cc);color:var(--on);border-color:var(--cc);transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.box{position:relative;width:min(100%,340px);aspect-ratio:1;border:2px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden}
.box>*{position:absolute;transform:translate(-50%,-50%);line-height:1}
.box>.noise{inset:0;width:100%;height:100%;transform:none;image-rendering:pixelated}
.slot{width:46px;height:46px;border-radius:50%;border:2px dashed var(--mute);background:transparent;padding:0}
.slot.lit{background:var(--cc);border-style:solid;border-color:var(--cc)}
.slot.ok{background:var(--good);border-color:var(--good);border-style:solid}
.slot.no{background:var(--bad);border-color:var(--bad);border-style:solid}
.arena{position:relative;border:2px solid var(--line);border-radius:24px;background:var(--surface);overflow:hidden;touch-action:none;max-width:100%}
.orb{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--cc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:var(--on);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.orb.tgt{box-shadow:0 0 0 5px var(--good)}.orb.sel{box-shadow:0 0 0 5px var(--ink)}.orb.no{background:var(--bad)}
.g{display:grid;gap:10px;width:min(100%,340px)}
.cell{aspect-ratio:1;border:2px solid var(--line);background:var(--surface);border-radius:16px;display:flex;align-items:center;justify-content:center;padding:0;font-size:1.8rem;box-shadow:0 3px 0 var(--line)}
.cell.lit{background:var(--cc);border-color:var(--cc)}.cell.ok{background:var(--good);border-color:var(--good)}.cell.no{background:var(--bad);border-color:var(--bad)}
.mcard{aspect-ratio:1;border-radius:16px;background:var(--cc);font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;color:var(--on);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.mcard.up{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}.mcard.done{background:var(--surface);color:var(--ink);opacity:.4;box-shadow:none}
.card{width:120px;height:170px;border-radius:16px;border:2px solid var(--line);background:#fffdf8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:2.6rem;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.card small{font-size:2.2rem}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,360px)}
.faces button{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:4px;display:flex;justify-content:center;box-shadow:0 3px 0 var(--line)}
.faces button svg{width:100%;height:auto}
.road{position:relative;width:100%;height:min(52vh,380px);border-radius:24px;overflow:hidden;border:2px solid var(--line)}
.road>div{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:pointer}
canvas.sw{width:min(100%,300px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.rt{display:flex;gap:16px;justify-content:center}
.rt div{width:130px;height:130px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:22px;background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:5rem}
.rhy{position:relative;width:min(100%,340px);height:40px;border-bottom:3px solid var(--line)}
.rhy b{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%;background:var(--cc);transform:translateX(-50%)}
.rhy b.u{background:var(--ink);bottom:24px;width:10px;height:10px}
.story{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;line-height:1.5;max-width:40ch}
.tag{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cc)}
.disp{font-family:var(--f-display);font-weight:800;font-size:2.4rem;min-height:1.3em;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-align:center}
.fb{position:absolute;inset:0;pointer-events:none;border-radius:24px;opacity:0;transition:opacity .25s;z-index:5}
.fb.good{background:var(--good)}.fb.bad{background:var(--bad)}

/* levels */
.ihead{display:flex;align-items:center;gap:16px}
.ihead .bigic{width:76px;height:76px;border-radius:24px}
.ihead h1{font-size:2rem}
.levels{display:flex;flex-direction:column;gap:14px}
.tier-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.tier-h b{font-family:var(--f-display);font-size:1.05rem;color:var(--tc)}
.tier-h span{font-size:.78rem;color:var(--mute);text-align:right}
.lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvb{height:72px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.lvb b{font-family:var(--f-display);font-size:1.5rem;line-height:1;display:flex}
.lvb span{color:var(--c-spd);font-size:.95rem;letter-spacing:2px;line-height:1}
.lvb.sel{border-color:var(--tc);background:var(--tc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.lvb.sel span{color:#fff}
.lvb:active{transform:translateY(3px)}
.lvb:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;transform:none}
.lvbar{display:flex;gap:3px;position:relative}
.lvbar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.lvbar i.on{background:var(--on)}
.ring.fail{border-color:var(--line)}

/* report */
.rcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.rcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.rbars{display:flex;align-items:flex-end;gap:4px;height:44px;width:62px}
.rbars i{flex:1;border-radius:3px;background:var(--cc)}
.rtx{display:flex;flex-direction:column;gap:3px;font-size:.92rem;line-height:1.35;min-width:0}
.rgo{color:var(--mute)}
.sec-h{font-size:1.15rem;font-weight:800;margin-bottom:12px}
.sw2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swc{background:var(--cc);color:var(--on);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.swc .eyebrow{color:inherit;opacity:.85}
.swc b{font-family:var(--f-display);font-size:1.3rem;line-height:1.15}
.swc em{font-style:normal;font-weight:700;opacity:.9}
.areas,.weak,.sugg{display:flex;flex-direction:column;gap:12px}
.arow{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.atop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.atop b{font-family:var(--f-display);font-size:1.02rem}
.atop span{font-size:.85rem;font-weight:800;color:var(--cc);font-variant-numeric:tabular-nums}
.abar{height:10px;border-radius:5px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.abar i{display:block;height:100%;border-radius:5px;background:var(--cc)}
.arow p,.srow p{margin:0;font-size:.82rem;color:var(--mute);line-height:1.4}
.wrow,.shead{display:flex;align-items:center;gap:12px}
.wrow{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.gic2{width:40px;height:40px;border-radius:13px;background:var(--cc);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
.wtx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.wtx b{font-family:var(--f-display);font-size:1rem}
.wtx span{font-size:.8rem;color:var(--mute)}
.srow{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 var(--line)}
.sgo{background:var(--cc);color:var(--on);font-family:var(--f-display);font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.sgo:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="st0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#e5483d"/></pattern>
<pattern id="st1" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#2f7de1"/></pattern>
<pattern id="st2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#2fa84f"/></pattern>
</defs></svg>
<script>
const $=(s,r=document)=>r.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
let store={};try{store=JSON.parse(localStorage.getItem('mindgym2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('mindgym2',JSON.stringify(store))}catch(e){}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ---------- sound ---------- */
let actx=null;
function AC(){if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A()}if(actx.state==='suspended')actx.resume();return actx}
function tone(f1,f2,ms,vol=.22,type='sine'){const a=AC();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+ms/1000);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);
  g.gain.setValueAtTime(vol,t+Math.max(.006,ms/1000-.01));g.gain.linearRampToValueAtTime(0,t+ms/1000);o.connect(g).connect(a.destination);o.start(t);o.stop(t+ms/1000+.02)}
const NATIVE=typeof window.AndroidTTS!=='undefined';
const hasSpeech=NATIVE||('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window);
const ttsWait={};let ttsN=0;window.__ttsDone=id=>{const f=ttsWait[id];if(f){delete ttsWait[id];f()}};
function say(t,rate=1){return new Promise(res=>{if(!hasSpeech){res();return}let done=false;const fin=()=>{if(!done){done=true;res()}};
  if(NATIVE){const id='u'+(++ttsN);ttsWait[id]=fin;try{window.AndroidTTS.speak(t,rate,id)}catch(e){fin()}}
  else{try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}}
  setTimeout(fin,1500+t.length*120/rate)})}
function hush(){try{if(NATIVE)window.AndroidTTS.stop();else if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}

/* ---------- shared helpers ---------- */
const stair=(start,min,max,f=.85)=>{let v=start,ok=0;return{get v(){return Math.round(v)},hit(){if(++ok>=2){ok=0;v=Math.max(min,v*f)}},miss(){ok=0;v=Math.min(max,v/f)}}};
function options(el,labels,cb,cls='grid2'){const w=mk('div',cls);labels.forEach(l=>{const b=mk('button','btn',l);b.onclick=()=>cb(l,b);w.append(b)});el.append(w);return w}
const ask=(k,labels,cls)=>new Promise(res=>{k.replaceChildren();options(k,labels,l=>{k.replaceChildren();res(l)},cls)});
function flash(c,ok,count=true){if(count&&c.tally)c.tally(ok);const f=$('.fb',c.stage);if(f){f.className='fb '+(ok?'good':'bad');f.style.opacity=.28;setTimeout(()=>{f.style.opacity=0},170)}buzz(ok?10:40)}
function lay(c){c.stage.innerHTML='<div class="fb"></div><div id="v"></div><div id="k"></div>';return[$('#v',c.stage),$('#k',c.stage)]}
function keypad(el,onKey,okLabel='✓'){const k=mk('div','grid3');k.style.width='min(100%,320px)';
  ['1','2','3','4','5','6','7','8','9','⌫','0',okLabel].forEach(x=>{const b=mk('button','btn',x);b.onclick=()=>onKey(x===okLabel?'ok':x==='⌫'?'del':x);k.append(b)});el.append(k);return k}
const ringXY=(i,n,r,off=-Math.PI/2)=>{const a=i/n*Math.PI*2+off;return[50+r*Math.cos(a),50+r*Math.sin(a)]};
function put(b,html,x,y,fs=2,rot=0){const e=mk('div');e.innerHTML=html;e.style.left=x+'%';e.style.top=y+'%';e.style.fontSize=fs+'rem';if(rot)e.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;b.append(e);return e}
function noise(b){const cv=mk('canvas','noise');cv.width=cv.height=72;const x=cv.getContext('2d'),d=x.createImageData(72,72);
  for(let i=0;i<d.data.length;i+=4){const v=rnd(256);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);b.append(cv);return cv}
function slots(b,n,r){return [...Array(n)].map((_,i)=>{const[x,y]=ringXY(i,n,r);const s=mk('button','slot');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label','Position '+(i+1));b.append(s);return s})}
const tapOne=els=>new Promise(res=>els.forEach((e,i)=>e.onclick=()=>{els.forEach(x=>x.onclick=null);res(i)}));
function scatter(n,minD,pad=10){const p=[];let g=0;while(p.length<n&&g++<3000){const x=pad+Math.random()*(100-2*pad),y=pad+Math.random()*(100-2*pad);if(p.every(q=>Math.hypot(q[0]-x,q[1]-y)>minD))p.push([x,y])}return p}
const arenaSize=()=>[Math.min(innerWidth-32,480),Math.max(240,Math.min(innerHeight-300,420))];
function spawnOrbs(ar,n,W,H){const o=[];const pos=scatter(n,14,6);for(let i=0;i<n;i++){const e=mk('div','orb');ar.append(e);
  const q={e,x:(pos[i]?pos[i][0]:rnd(90))/100*(W-40),y:(pos[i]?pos[i][1]:rnd(90))/100*(H-40),a:Math.random()*6.283};e.style.left=q.x+'px';e.style.top=q.y+'px';o.push(q)}return o}
function drift(c,o,W,H,ms,sp){return new Promise(res=>{let last=performance.now();const end=last+ms;const f=t=>{if(!c.alive)return;const dt=Math.min(50,Math.max(0,t-last))/1000;last=t;
  o.forEach(q=>{q.x+=Math.cos(q.a)*sp*dt;q.y+=Math.sin(q.a)*sp*dt;
    if(q.x<0||q.x>W-40){q.a=Math.PI-q.a;q.x=Math.max(0,Math.min(W-40,q.x))}
    if(q.y<0||q.y>H-40){q.a=-q.a;q.y=Math.max(0,Math.min(H-40,q.y))}
    if(Math.random()<.015)q.a+=(Math.random()-.5)*1.2;q.e.style.left=q.x+'px';q.e.style.top=q.y+'px'});
  if(t<end)requestAnimationFrame(f);else res()};requestAnimationFrame(f)})}
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];

/* ---------- faces (drawn, not photos) ---------- */
const SK=['#f3d2b3','#e0ac81','#c68642','#8d5524','#f6dcc6','#d9a066'],HC=['#2b1b12','#6a3b1a','#b5651d','#d8b25c','#8a8a8a','#111111','#a23b1c'];
function rface(){return{skin:pick(SK),hair:pick(HC),hs:rnd(4),ew:11+rnd(8),es:3+rnd(3),nose:rnd(3),rx:27+rnd(9),gl:rnd(4)===0,mu:rnd(5)===0}}
function varyFace(p,n){const q={...p};shuffle(['skin','hair','hs','ew','nose','rx','gl','mu','es']).slice(0,n).forEach(k=>{let t=0;do{q[k]=rface()[k]}while(q[k]===p[k]&&t++<30)});return q}
const EMO={happy:[0,0,'smile'],sad:[-7,1,'frown'],angry:[8,-2,'tight'],surprised:[0,7,'o'],afraid:[-6,6,'wave'],disgusted:[6,-1,'sneer'],neutral:[0,0,'flat'],contempt:[2,0,'smirk'],tired:[0,-3,'flat'],proud:[-1,2,'smile2'],confused:[5,3,'tilt']};
function faceSVG(p,emo='neutral',k=1,shift=0){const E=EMO[emo]||EMO.neutral,tilt=E[0]*k,raise=E[1]*k,m=E[2],sq=1-Math.abs(shift)*.28,ey=54,ex=p.ew;
  const back=p.hs===1?`<ellipse cx="50" cy="70" rx="${p.rx+7}" ry="46" fill="${p.hair}"/>`:'';
  const cap=p.hs===2?'':p.hs===3?[...Array(9)].map((_,i)=>`<circle cx="${50-p.rx+i*p.rx/4}" cy="${30+Math.abs(i-4)*3}" r="9" fill="${p.hair}"/>`).join(''):`<path d="M${48-p.rx} 56 Q50 6 ${52+p.rx} 56 Q50 32 ${48-p.rx} 56Z" fill="${p.hair}"/>`;
  const lid=emo==='tired'?`<path d="M${50-ex-6} ${ey} h12 M${50+ex-6} ${ey} h12" stroke="${p.skin}" stroke-width="5"/>`:'';
  const er=p.es+Math.max(0,raise)*.25;
  const eyes=[50-ex,50+ex].map(x=>`<ellipse cx="${x}" cy="${ey}" rx="${er+2.5}" ry="${er+1.5}" fill="#fff"/><circle cx="${x+shift*2}" cy="${ey}" r="${er-.5}" fill="#1d1d1d"/>`).join('');
  const by=ey-11-raise*.9;
  const brows=`<path d="M${50-ex-8} ${by} L${50-ex+7} ${by+tilt*.6}" stroke="#2a1d16" stroke-width="2.6" stroke-linecap="round"/><path d="M${50+ex-7} ${by+tilt*.6+(emo==='confused'?-5*k:0)} L${50+ex+8} ${by}" stroke="#2a1d16" stroke-width="2.6" stroke-linecap="round"/>`;
  const ny=66+p.nose*3,nose=`<path d="M50 ${ny-10} L47 ${ny} L53 ${ny}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.8" stroke-linejoin="round"/>`;
  const my=86,M={smile:`M39 ${my} Q50 ${my+14*k} 61 ${my}`,smile2:`M42 ${my+1} Q50 ${my+7*k} 58 ${my+1}`,frown:`M40 ${my+5} Q50 ${my+5-12*k} 60 ${my+5}`,tight:`M42 ${my+3} Q50 ${my+3-4*k} 58 ${my+3}`,
    wave:`M40 ${my+3} Q45 ${my+3-5*k} 50 ${my+3} T60 ${my+3}`,sneer:`M40 ${my+3} Q48 ${my+3} 60 ${my-4*k}`,flat:`M42 ${my+2} L58 ${my+2}`,smirk:`M42 ${my+2} Q52 ${my+2} 59 ${my-3*k}`,tilt:`M42 ${my+3} L58 ${my+3-4*k}`};
  const mouth=m==='o'?`<ellipse cx="50" cy="${my+3}" rx="${4+2*k}" ry="${3+6*k}" fill="#5a1f1f"/>`:`<path d="${M[m]}" fill="none" stroke="#7a2b2b" stroke-width="3" stroke-linecap="round"/>`;
  const mu=p.mu?`<path d="M41 ${my-5} Q50 ${my-10} 59 ${my-5}" stroke="${p.hair}" stroke-width="4" fill="none" stroke-linecap="round"/>`:'';
  const gl=p.gl?`<g fill="none" stroke="#333" stroke-width="2"><circle cx="${50-ex}" cy="${ey}" r="${p.es+6}"/><circle cx="${50+ex}" cy="${ey}" r="${p.es+6}"/><path d="M${50-ex+p.es+6} ${ey} L${50+ex-p.es-6} ${ey}"/></g>`:'';
  return `<svg viewBox="0 0 100 120" width="96" height="115" aria-hidden="true">${back}<ellipse cx="50" cy="64" rx="${p.rx}" ry="40" fill="${p.skin}"/>${cap}<g transform="translate(${shift*14} 0) translate(50 0) scale(${sq} 1) translate(-50 0)">${eyes}${lid}${brows}${nose}${mu}${mouth}${gl}</g></svg>`}

const lerp=(c,a,b)=>a+(b-a)*c.t, ilerp=(c,a,b)=>Math.round(lerp(c,a,b)), glerp=(c,a,b)=>Math.round(a*Math.pow(b/a,c.t)), tier=c=>c.L<=3?0:c.L<=6?1:2;
const GAMES=[
/* ===== ATTENTION ===== */
{id:'tracker',cat:'att',name:'Target Tracker',desc:'Some bubbles light up. Then look-alikes join and everything drifts around. When it stops, tap the bubbles you were tracking.',async run(c){
  const t=ilerp(c,2,6),d=ilerp(c,3,8),sp=lerp(c,70,260),dur=lerp(c,3000,7000),show=glerp(c,2200,1000),N=6;

    c.hint(`Round ${r+1}/${N} · remember these ${t}`);await c.sleep(show);o.forEach(q=>q.e.classList.remove('tgt'));c.hint('Keep your eyes on them…');

  c.finish(`${t} targets among ${t+d} bubbles`);
}},

{id:'divided',cat:'att',name:'Divided Attention',desc:'Two shapes flash. Tap Match only when they follow the rule on screen (same colour, same shape, same fill, or a combination). The rule keeps changing.',async run(c){

    c.hint('Tap the TWO spots that showed the same arrow');const sel=[];
    await new Promise(res=>pos.forEach((p,i)=>sl[p].onclick=()=>{if(sel.includes(i))return;sel.push(i);sl[p].classList.add('lit');if(sel.length===2)res()}));
    const good=sel.every(i=>order[i].same);pos.forEach((p,i)=>{if(order[i].same)sl[p].classList.add('ok');else if(sel.includes(i))sl[p].classList.add('no')});
    flash(c,good);await c.sleep(900)}

{id:'sweeps',cat:'spd',name:'Sound Sweeps',needsAudio:1,desc:'You hear quick sounds that glide up or down in pitch. Report the direction of each one, in order. Higher levels play shorter sweeps and more of them.',async run(c){

    const d=[...Array(n)].map(()=>rnd(2));for(const x of d){x?tone(700,1300,dur):tone(1300,700,dur);await c.sleep(dur+Math.max(90,dur))}
    let all=true;for(let i=0;i<n;i++){c.hint(ORD[i]+' sound?');const a=await ask(k,['⬆ Up','⬇ Down']);if((a==='⬆ Up')!==!!d[i])all=false}

  c.finish(`${n} sweeps of ${dur} ms`);
}},
{id:'vsweeps',cat:'spd',name:'Visual Sweeps',desc:'Striped rings move twice, each time either outward or inward. Report the direction of the first move, then the second. Higher levels move faster.',async run(c){
  const dur=glerp(c,850,60),N=14,COLS=['#e5483d','#2f7de1','#2fa84f','#e8b800','#8a4fd1'];
  for(let r=0;r<N;r++){const[v,k]=lay(c),cv=mk('canvas','sw');cv.width=cv.height=300;v.append(cv);const x=cv.getContext('2d'),col=pick(COLS),sp=14+rnd(14);
    const draw=ph=>{x.clearRect(0,0,300,300);x.strokeStyle=col;x.lineWidth=sp/2;for(let rr=((ph%sp)+sp)%sp;rr<150;rr+=sp){x.beginPath();x.arc(150,150,rr,0,6.283);x.stroke()}};
    const d=[rnd(2),rnd(2)];let ph=0;draw(ph);c.hint(`${r+1}/${N} · watch the rings`);await c.sleep(700);
    for(const dir of d){await new Promise(res=>{const t0=performance.now(),s=ph;const f=t=>{if(!c.alive)return;const p=Math.min(1,(t-t0)/dur);ph=s+(dir?1:-1)*sp*.42*p;draw(ph);p<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)});await c.sleep(350)}
    x.clearRect(0,0,300,300);c.hint('First move?');const a1=await ask(k,['Outward','Inward']);c.hint('Second move?');const a2=await ask(k,['Outward','Inward']);
    flash(c,(a1==='Outward')===!!d[0]&&(a2==='Outward')===!!d[1])}
  c.finish(`Each move lasts ${dur} ms`);
}},
{id:'tuning',cat:'spd',name:'Fine Tuning',needsAudio:1,desc:'You hear one word from a pair that sounds alike, like "bee" and "pea". Pick the one you heard. Higher levels speak faster and use closer pairs.',async run(c){
  const P0=[['bee','pea'],['bay','day'],['tea','key'],['bit','pit'],['goat','coat'],['fan','van']],P2=[['fin','thin'],['sip','ship'],['vat','that'],['bun','done'],['gum','come'],['dune','tune'],['bark','park'],['zip','sip']];

  for(let r=0;r<N;r++){const[v,k]=lay(c);v.innerHTML='<div class="big">🔊</div>';const pr=pick(P),w=pick(pr);c.hint(`${r+1}/${N} · listen…`);await c.sleep(500);await c.say(w,rate);

{id:'scene',cat:'mem',name:'Scene Crasher',desc:'A scene of objects flashes, then static wipes it. The scene comes back with one extra object. Tap the new one.',async run(c){
  const n=ilerp(c,4,13),T=glerp(c,2200,350),minD=lerp(c,16,11),KINDS=['🐑','🔑','🍄','🐟','⭐','🌼'],N=10;
  for(let r=0;r<N;r++){const[v]=lay(c),b=mk('div','box');v.append(b);const kind=KINDS[r%KINDS.length];let pos=scatter(n+1,minD,8);if(pos.length<n+1)pos=scatter(n+1,minD*.8,6);const m=pos.length-1;
    c.hint(`${r+1}/${N} · memorise the scene`);await c.sleep(500);pos.slice(0,m).forEach(([x,y])=>put(b,kind,x,y,1.8));await c.sleep(T);
    b.replaceChildren();noise(b);await c.sleep(600);b.replaceChildren();const els=pos.map(([x,y])=>put(b,kind,x,y,1.8));els.forEach(e=>e.style.cursor='pointer');
    c.hint('Tap the new one');const i=await tapOne(els);els[m].style.filter='drop-shadow(0 0 6px var(--good))';if(i!==m)els[i].style.opacity=.3;flash(c,i===m);await c.sleep(900)}
  c.finish(`${n} objects, ${T} ms look`);
}},
{id:'mgrid',cat:'mem',name:'Memory Grid',needsAudio:1,desc:'Each card plays a syllable when you turn it over. Find all the pairs of cards that play the same syllable, in as few moves as you can.',async run(c){
  const pairs=[4,4,5,6,6,8,8,9,10][c.L-1],cols={4:4,5:5,6:4,8:4,9:6,10:5}[pairs],rate=lerp(c,.75,1.2);
  const SY=[['ma','so','ki','lu','be','ro','fa','ti','zo','ne'],['ba','so','ki','da','me','ro','fa','ti','go','ne'],['ba','pa','da','ta','ga','ka','ma','na','fa','va']][tier(c)];
  const sy=shuffle(SY).slice(0,pairs),cards=shuffle([...sy,...sy]);let open=[],found=0,lock=false,moves=0;
  const[v]=lay(c),g=mk('div','g');g.style.gridTemplateColumns=`repeat(${cols},1fr)`;v.append(g);
  c.hint(hasSpeech?'Tap cards to hear them. Match the pairs.':'Speech unavailable: syllables are written on the cards.');
  await new Promise(done=>cards.forEach(s=>{const b=mk('button','mcard','?');b.onclick=()=>{if(lock||b.classList.contains('up'))return;b.classList.add('up');b.textContent=hasSpeech?'🔊':s;say(s,rate);open.push([b,s]);
    if(open.length===2){moves++;const[[b1,s1],[b2,s2]]=open;open=[];
      if(s1===s2){c.tally(true);lock=true;setTimeout(()=>{b1.classList.add('done');b2.classList.add('done');b1.textContent=b2.textContent=s1;lock=false;if(++found===pairs)setTimeout(done,500)},500)}
      else{c.tally(false);lock=true;c.after(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='?'});lock=false},900)}}};g.append(b)}));
  c.finish(`${pairs} pairs in ${moves} moves`,Math.min(1,pairs*1.8/moves));
}},
{id:'stacks',cat:'mem',name:'Syllable Stacks',needsAudio:1,desc:'Listen to a series of syllables, then tap them back in the same order. Higher levels play longer, faster series of similar sounds.',async run(c){
  const Ls=ilerp(c,2,7),rate=lerp(c,.7,1.45),gap=glerp(c,400,40),nb=Math.min(8,Ls+2),N=8;
  const SY=[['ma','so','ki','lu','be','ro','fa','ti'],['ba','so','ki','da','me','ro','fa','ti'],['ba','pa','da','ta','ga','ka','ma','na']][tier(c)];
  for(let r=0;r<N;r++){const[v,k]=lay(c),shown=shuffle(SY).slice(0,nb),seq=[...Array(Ls)].map(()=>pick(shown));
    v.innerHTML='<div class="big">🔊</div>';c.hint(`${r+1}/${N} · listen…`);await c.sleep(600);

    v.innerHTML='<div class="disp" style="font-size:2rem" id="d"></div>';c.hint('Tap them in order');const typed=[];
    await new Promise(res=>{const w=mk('div','grid3');shown.forEach(s=>{const b=mk('button','btn',s);b.onclick=()=>{typed.push(s);$('#d',v).textContent=typed.join(' ');if(typed.length===Ls)res()};w.append(b)});k.append(w)});
    seq.forEach((s,i)=>c.tally(typed[i]===s));flash(c,typed.join()===seq.join(),false);await c.sleep(700)}

{id:'todo',cat:'mem',name:'To-Do List Training',needsAudio:1,desc:'Listen to a list of instructions, then carry them out in order by tapping the right objects.',async run(c){
  const OBJ=[['🔴','red circle'],['🔵','blue circle'],['🟢','green circle'],['🟡','yellow circle'],['🟥','red square'],['🟦','blue square'],['🟩','green square'],['🟨','yellow square'],['🟠','orange circle'],['🟧','orange square'],['🟣','purple circle'],['🟪','purple square']];

    if(hasSpeech)await c.say(text,rate);else{c.hint(text);await c.sleep(1500+k2*1100)}

{id:'mindseye',cat:'mem',name:"Mind's Eye",desc:'A target shape is shown, then hidden. Then find it among look-alikes that differ in colour, shape or tilt. (Built from a short description, so it may differ from the original.)',async run(c){
  const SH=['▲','■','●','◆','★'],CO=['#e5483d','#2f7de1','#2fa84f','#e8b800','#8a4fd1'],RO=[0,20,45,90];
  const n=ilerp(c,4,9),ch=c.L<=3?2:1,view=glerp(c,2000,500),hold=glerp(c,500,2200),N=12;
  const html=o=>`<span style="display:inline-block;color:${o.c};transform:rotate(${o.r}deg)">${o.s}</span>`;
  for(let r=0;r<N;r++){const[v]=lay(c),T={s:pick(SH),c:pick(CO),r:pick(RO)};
    v.innerHTML=`<div class="big" style="font-size:6rem">${html(T)}</div>`;c.hint(`${r+1}/${N} · remember this one`);await c.sleep(view);v.innerHTML='';c.hint('Hold it in mind…');await c.sleep(hold);
    const set=[T];let g=0;while(set.length<n&&g++<500){const d={...T};shuffle(['s','c','r']).slice(0,ch).forEach(k=>{d[k]=pick(k==='s'?SH:k==='c'?CO:RO)});if(set.every(x=>x.s!==d.s||x.c!==d.c||x.r!==d.r))set.push(d)}
    const opts=shuffle(set),w=mk('div','g');w.style.gridTemplateColumns='repeat(3,1fr)';const els=opts.map(o=>{const b=mk('button','cell');b.innerHTML=html(o);b.style.fontSize='2.6rem';w.append(b);return b});v.append(w);
    c.hint('Tap the one you saw');const i=await tapOne(els),good=opts[i]===T;els[opts.indexOf(T)].classList.add('ok');if(!good)els[i].classList.add('no');flash(c,good);await c.sleep(800)}
  c.finish(`${n} choices, ${(hold/1000).toFixed(1)} s delay`);
}},
{id:'hearhear',cat:'mem',name:'Hear, Hear',needsAudio:1,desc:'Learn a target sound, then listen to a stream of sounds. Tap only when you hear the target. Higher levels use decoys that sound almost the same. (Built from a short description, so it may differ from the original.)',async run(c){
  const near=lerp(c,350,70),gap=glerp(c,1400,700),N=36;
  const S={tgt:()=>tone(600,950,220),down:()=>tone(950,600,220),flat:()=>tone(780,780,220),near:()=>tone(600,950-near,220),nearlo:()=>tone(600+near*.6,950,220),sq:()=>tone(600,950,220,.16,'square')};
  const pool=[['down','flat'],['down','flat','near'],['near','nearlo','sq']][tier(c)];
  const[v,k]=lay(c);v.innerHTML='<div class="big">🎧</div>';c.hint('This is the target sound');for(let i=0;i<3;i++){S.tgt();await c.sleep(700)}
  const pad=mk('button','pad','That’s it!');k.append(pad);let pressed=false;pad.onpointerdown=()=>{if(!pressed){pressed=true;pad.classList.add('on')}};
  c.hint('Tap only for the target sound');
  for(let i=0;i<N;i++){const isT=Math.random()<.3;pressed=false;pad.classList.remove('on');(isT?S.tgt:S[pick(pool)])();
    await c.sleep(gap);if(pressed||isT)flash(c,pressed===isT);else c.tally(true)}
  c.finish(`Closest decoy ${Math.round(near)} Hz away`);
}},
{id:'rhythm',cat:'mem',name:'Rhythm Recall',needsAudio:1,desc:'Hear a short melody and watch its rhythm on screen, then tap the rhythm back on the pad. Only the timing counts, not the notes.',async run(c){
  const n=ilerp(c,3,8),tol=lerp(c,.4,.15),IV=[[400,800],[300,600,900],[200,300,450,600,900]][tier(c)],N=8;
  for(let r=0;r<N;r++){const[v,k]=lay(c),gaps=[...Array(n-1)].map(()=>pick(IV)),tot=gaps.reduce((a,b)=>a+b,0),line=mk('div','rhy');v.append(line);
    c.hint(`${r+1}/${N} · listen and watch`);await c.sleep(600);let t=0;const marks=[0,...gaps.map(g=>t+=g)];
    for(let i=0;i<n;i++){const d=mk('b');d.style.left=(5+marks[i]/tot*90)+'%';line.append(d);{const f=pick([392,440,523,587,659]);tone(f,f,140,.25,'triangle')}if(i<n-1)await c.sleep(gaps[i])}
    await c.sleep(700);c.hint('Now tap it back');const pad=mk('button','pad','Tap');pad.style.minHeight='140px';k.append(pad);const taps=[];
    await new Promise(res=>pad.onpointerdown=()=>{taps.push(performance.now());tone(523,523,90,.2,'triangle');const u=mk('b','u');u.style.left=(5+(taps[taps.length-1]-taps[0])/tot*90)+'%';line.append(u);if(taps.length===n)res()});
    const got=taps.slice(1).map((x,i)=>x-taps[i]),oks=got.map((g,i)=>Math.abs(g-gaps[i])<=gaps[i]*tol+60);oks.forEach(o=>c.tally(o));flash(c,oks.every(Boolean),false);await c.sleep(900)}
  c.finish(`${n} notes, ±${Math.round(tol*100)}% timing`);
}},

{id:'facefacts',cat:'ppl',name:'Face Facts',desc:'Meet a few people, each with a name and a job. Then see each face again and pick their name and job.',async run(c){

{id:'inknow',cat:'ppl',name:'In the Know',needsAudio:1,desc:'Listen to a short story, then answer questions about the details. Higher levels tell longer stories, faster.',async run(c){
  const NM=['Maria','Tom','Elena','Jack','Priya','Omar','Grace','Leo'],PL=['market','library','beach','station','farm','museum','bakery'],IT=['apples','books','candles','tickets','scarves','plates'],CL=['red','blue','green','yellow','white'],DY=['Monday','Tuesday','Friday','Saturday','Sunday'],TH=['umbrella','guitar','basket','camera','kite'],FD=['sandwiches','cookies','oranges','pancakes'];

{id:'bender',cat:'int',name:'Mind Bender',desc:'Two numbers appear. If they are digits, tap the HIGHER one. If they are written as words, tap the LOWER one. Answer before time runs out.',async run(c){
  const win=glerp(c,3200,900),max=c.L<=3?10:20,close=c.L>=7,N=24;const[v,k]=lay(c);const rule=mk('p','tag');rule.textContent='Digits → tap higher · Words → tap lower';v.append(rule);
  for(let r=0;r<N;r++){const a=rnd(max)+1;let b;do{b=close?a+(Math.random()<.5?-1:1)*(1+rnd(2)):rnd(max)+1}while(b===a||b<1||b>max);
    const words=Math.random()<.5,lab=x=>words?NUMW[x]:String(x),want=words?Math.min(a,b):Math.max(a,b);c.hint(`${r+1}/${N}`);
    const got=await new Promise(res=>{k.replaceChildren();const w=mk('div','grid2');[a,b].forEach(x=>{const bt=mk('button','btn',lab(x));bt.style.minHeight='110px';bt.style.fontSize=words?'1.4rem':'2.6rem';bt.onclick=()=>res(x);w.append(bt)});k.append(w);c.after(()=>res(null),win)});
    k.replaceChildren();flash(c,got===want);await c.sleep(220)}
  c.finish(`${(win/1000).toFixed(1)} s to answer`);
}},
{id:'cardshark',cat:'int',name:'Card Shark',desc:'Cards appear one at a time. Say whether each card matches the one shown N cards earlier. Higher levels go further back and match on more features.',async run(c){
  const SU=['♠','♥','♦','♣'],RK=['A','2','3','4','5','6','7','8','9'],n=[1,1,2,2,2,3,3,4,4][c.L-1],m=['suit','number','suit','number','both','number','both','both','both'][c.L-1],win=glerp(c,2800,1100),N=30,hist=[];
  const same=(x,y)=>m==='suit'?x.s===y.s:m==='number'?x.r===y.r:x.s===y.s&&x.r===y.r;const[v,k]=lay(c);
  for(let r=0;r<N;r++){const prev=hist.length>=n?hist[hist.length-n]:null;let cd;
    if(prev&&Math.random()<.35)cd={...prev};else{let g=0;do{cd={s:pick(SU),r:pick(RK)}}while(prev&&same(cd,prev)&&g++<60)}
    hist.push(cd);c.hint(`${n}-back · match the ${m==='both'?'suit AND number':m}`);
    v.innerHTML=`<div class="card" style="color:${'♥♦'.includes(cd.s)?'#d23b3b':'#1b1b1b'}">${cd.r}<small>${cd.s}</small></div>`;
    if(!prev){await c.sleep(1400);v.innerHTML='';await c.sleep(300);continue}
    const a=await Promise.race([ask(k,['Match','No match']),c.sleep(win).then(()=>null)]);k.replaceChildren();
    flash(c,a!==null&&(a==='Match')===same(cd,prev));v.innerHTML='';await c.sleep(280)}
  c.finish(`${n}-back, ${m==='both'?'suit and number':m}`);
}},
{id:'juggle',cat:'int',name:'Juggle Factor',desc:'Numbers appear on balls, then the balls move around. When they stop, tap the balls in the order asked: forward, backward, or a mixed order.',async run(c){
  const k=ilerp(c,3,7),ex=ilerp(c,0,3),sp=lerp(c,70,220),dur=lerp(c,2500,5000),mode=['fwd','back','mix'][tier(c)],N=6;const[W,H]=arenaSize();
  for(let r=0;r<N;r++){const[v]=lay(c),ar=mk('div','arena');ar.style.width=W+'px';ar.style.height=H+'px';v.append(ar);
    const o=spawnOrbs(ar,k+ex,W,H),nums=shuffle([...Array(k)].map((_,i)=>i+1));o.forEach((q,i)=>{q.n=nums[i]||0;q.e.textContent=q.n||'';if(!q.n)q.e.style.background='var(--mute)'});
    c.hint(`Round ${r+1}/${N} · remember the numbers`);await c.sleep(1500+k*350);o.forEach(q=>{q.e.textContent='';q.e.style.background=''});
    await drift(c,o,W,H,dur,sp);const order=mode==='fwd'?nums.slice().sort((a,b)=>a-b):mode==='back'?nums.slice().sort((a,b)=>b-a):shuffle(nums);
    c.hint('Tap in this order: '+order.join(' → '));const got=[];
    await new Promise(res=>o.forEach(q=>q.e.onclick=()=>{if(q.s)return;q.s=1;got.push(q.n);q.e.textContent=q.n||'✕';q.e.classList.add('sel');if(got.length===k)res()}));
    order.forEach((x,i)=>c.tally(got[i]===x));flash(c,got.every((x,i)=>x===order[i]),false);await c.sleep(1000)}
  c.finish(`${k} numbers, ${mode==='fwd'?'forward':mode==='back'?'backward':'mixed'} order`);
}},
{id:'ace',cat:'int',name:'Auditory Ace',needsAudio:1,desc:'Like Card Shark, but the cards are spoken out loud. Say whether each card matches the one heard N cards earlier.',async run(c){
  const SU=['spades','hearts','diamonds','clubs'],RK=['ace','two','three','four','five','six','seven','eight','nine'],n=[1,1,2,2,2,3,3,3,4][c.L-1],rate=lerp(c,.95,1.3),win=glerp(c,3500,1800),N=24,hist=[];const[v,k]=lay(c);
  for(let r=0;r<N;r++){const prev=hist.length>=n?hist[hist.length-n]:null;let cd;if(prev&&Math.random()<.35)cd={...prev};else{let g=0;do{cd={s:pick(SU),r:pick(RK)}}while(prev&&cd.s===prev.s&&cd.r===prev.r&&g++<60)}
    hist.push(cd);c.hint(`${n}-back · same card as ${n} before?`);v.innerHTML='<div class="big">🔊</div>';
    const text=cd.r+' of '+cd.s;if(hasSpeech)await c.say(text,rate);else{v.innerHTML=`<div class="big" style="font-size:2rem">${text}</div>`;await c.sleep(1200)}
    if(!prev){await c.sleep(500);continue}
    const a=await Promise.race([ask(k,['Match','No match']),c.sleep(win).then(()=>null)]);k.replaceChildren();
    flash(c,a!==null&&(a==='Match')===(cd.s===prev.s&&cd.r===prev.r));await c.sleep(280)}
  c.finish(`${n}-back by ear`);
}},

{id:'rightturn',cat:'nav',name:'Right Turn',desc:'Two rotated shapes are shown. Decide whether they are the same shape turned, or a mirror image. Answer before time runs out.',async run(c){
  const G=[['F','R','L','P','J'],['F','R','G','J','L','P','Q','4','7'],['F','R','G','J','4','7','k','h','y','Q']][tier(c)],step=[90,45,15][tier(c)],win=glerp(c,5000,1300),N=20;
  for(let r=0;r<N;r++){const[v,k]=lay(c),ch=pick(G),mir=Math.random()<.5,a1=rnd(360/step)*step,a2=rnd(360/step)*step;
    v.innerHTML=`<div class="rt"><div><span style="display:inline-block;transform:rotate(${a1}deg)">${ch}</span></div><div><span style="display:inline-block;transform:rotate(${a2}deg) scaleX(${mir?-1:1})">${ch}</span></div></div>`;
    c.hint(`${r+1}/${N} · same shape, or a mirror image?`);const a=await Promise.race([ask(k,['Same','Mirror']),c.sleep(win).then(()=>null)]);k.replaceChildren();
    flash(c,a!==null&&(a==='Mirror')===mir);await c.sleep(250)}
  c.finish(`${(win/1000).toFixed(1)} s per pair`);
}},
{id:'mentalmap',cat:'nav',name:'Mental Map',desc:'Memorise where objects sit on a grid. The grid is then rotated, flipped or shifted. Rebuild it from memory in its new position.',async run(c){
  const EM=['🍎','🚗','🏠','🐟','⭐','🔔','🌵','🎈','⚓'],n=c.L<=3?3:c.L<=6?4:5,k=ilerp(c,3,9),mem=glerp(c,5500,2500),N=4;
  const TF=[['shifted one column right (wrapping around)',(r,cc,n)=>[r,(cc+1)%n]],['flipped left to right',(r,cc,n)=>[r,n-1-cc]],['flipped top to bottom',(r,cc,n)=>[n-1-r,cc]],['rotated 90° clockwise',(r,cc,n)=>[cc,n-1-r]],['rotated 90° anticlockwise',(r,cc,n)=>[n-1-cc,r]]];
  const pool=c.L<=2?TF.slice(0,1):c.L<=5?TF.slice(0,3):TF;
  for(let rd=0;rd<N;rd++){const cells=shuffle([...Array(n*n).keys()]).slice(0,k),objs=shuffle(EM).slice(0,k);let tf=pick(pool);
    if(c.L>=8){const inv=(a,b)=>a===b||(TF.indexOf(a)>=3&&TF.indexOf(b)>=3)||(TF.indexOf(a)===TF.indexOf(b));const t1=pick(TF),t2=pick(TF.filter(x=>!inv(t1,x)));tf=[t1[0]+', then '+t2[0],(r,cc,n)=>{const[a,b]=t1[1](r,cc,n);return t2[1](a,b,n)}]}
    const[v,kk]=lay(c);const grid=()=>{const g=mk('div','g');g.style.gridTemplateColumns=`repeat(${n},1fr)`;const cs=[...Array(n*n)].map(()=>{const b=mk('button','cell');if(n>4)b.style.fontSize='1.4rem';g.append(b);return b});v.replaceChildren(g);return cs};
    let cs=grid();cells.forEach((p,i)=>cs[p].textContent=objs[i]);c.hint(`Round ${rd+1}/${N} · memorise the grid`);await c.sleep(mem);cs.forEach(b=>b.textContent='');
    c.hint('The grid is '+tf[0]+'. Rebuild it: pick an object, then a cell.');await c.sleep(900);cs=grid();const placed={};let cur=null;
    const pal=mk('div','grid3');pal.style.gridTemplateColumns=`repeat(${Math.min(k,5)},1fr)`;objs.forEach(o=>{const b=mk('button','btn',o);b.onclick=()=>{cur=o;pal.querySelectorAll('.btn').forEach(x=>x.classList.toggle('on',x===b))};pal.append(b)});
    const done=mk('button','cta','Done');kk.append(pal,done);
    cs.forEach((b,i)=>b.onclick=()=>{if(placed[i]){delete placed[i];b.textContent='';return}if(!cur)return;Object.keys(placed).forEach(j=>{if(placed[j]===cur){delete placed[j];cs[j].textContent=''}});placed[i]=cur;b.textContent=cur});
    await new Promise(res=>done.onclick=res);let right=0;
    cells.forEach((p,i)=>{const[r2,c2]=tf[1](Math.floor(p/n),p%n,n),q=r2*n+c2,ok=placed[q]===objs[i];c.tally(ok);if(ok){right++;cs[q].classList.add('ok')}else{cs[q].classList.add('no');cs[q].textContent=objs[i]}});
    kk.replaceChildren();flash(c,right===k,false);await c.sleep(1800)}
  c.finish(`${k} objects on a ${n}×${n} grid`);
}},
{id:'truenorth',cat:'nav',name:'True North',needsAudio:1,desc:'Listen to directions on a train ride: which way you face, the stops, and your turns. Then say where you got off and which way you are facing.',async run(c){
  const D=['north','east','south','west'],ST=['Oak Street','Harbor','Central','Mill Lane','Park Gate','Riverside','Hill Top','Old Town'];
  const L=ilerp(c,1,6),nst=ilerp(c,3,6),rate=lerp(c,.85,1.3),N=8;
  for(let r=0;r<N;r++){const[v,k]=lay(c);let f=rnd(4);const start=D[f],steps=[...Array(L)].map(()=>pick(['left','right','around'])),stops=shuffle(ST).slice(0,nst),off=rnd(nst);
    const parts=[`You board the train facing ${start}.`,`The stops are ${stops.join(', ')}.`,`Get off at ${stops[off]}.`];steps.forEach(s=>{parts.push(s==='around'?'Turn around.':`Turn ${s}.`);f=(f+(s==='left'?3:s==='right'?1:2))%4});
    const text=parts.join(' ');v.innerHTML='<div class="big">🚆</div>';c.hint(`${r+1}/${N} · listen carefully`);await c.sleep(500);
    if(hasSpeech)await c.say(text,rate);else{v.innerHTML=`<div class="story">${text}</div>`;await c.sleep(3000+text.length*40);v.innerHTML='<div class="big">🚆</div>'}
    c.hint('Which stop did you get off at?');const a1=await ask(k,shuffle([stops[off],...shuffle(stops.filter(x=>x!==stops[off])).slice(0,3)]));
    flash(c,a1===stops[off]);c.hint('Which way are you facing now?');const a2=await ask(k,['North','East','South','West']);flash(c,a2.toLowerCase()===D[f]);await c.sleep(500)}
  c.finish(`${L} turns, ${nst} stops`);
}},
{id:'opticflow',cat:'nav',name:'Optic Flow',desc:'You are driving. Vehicles and roadside objects come toward you. Tap the one that matches the target before it passes. Higher levels are faster and busier.',async run(c){
  const SC=[['#e9c98f','#c9a66b'],['#bfe0a5','#8fbf7a'],['#b9c3cf','#8995a3']][tier(c)],IT=tier(c)===2?['🚗','🚙','🚕','🚓','🚐','🚌','🚎','🚑']:['🚗','🚚','🚌','🛵','🚲','🐄','🌳','⛽','🚜','🏍️'];
  const D=glerp(c,4500,1400),nb=ilerp(c,3,7),N=14;
  for(let r=0;r<N;r++){const[v]=lay(c),road=mk('div','road');road.style.background=`linear-gradient(${SC[0]} 0 35%,${SC[1]} 35%)`;
    road.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><polygon points="47,35 53,35 95,100 5,100" fill="#555"/><polygon points="49.6,35 50.4,35 51.5,100 48.5,100" fill="#eee"/></svg>';v.append(road);
    const target=pick(IT),batch=shuffle([target,...shuffle(IT.filter(x=>x!==target)).slice(0,nb-1)]),lanes=shuffle([-1,-.7,-.4,-.12,.15,.42,.7,1]).slice(0,batch.length);
    c.hint(`${r+1}/${N} · tap the ${target}`);const els=batch.map((e,i)=>{const d=mk('div');d.textContent=e;road.append(d);return{d,e,l:lanes[i],delay:Math.random()*.25}});
    const res=await new Promise(done=>{let fin=false;els.forEach(o=>o.d.onpointerdown=()=>{if(!fin){fin=true;done(o.e===target)}});const t0=performance.now();
      const f=t=>{if(!c.alive||fin)return;const p=(t-t0)/D;els.forEach(o=>{const q=Math.max(0,Math.min(1,(p-o.delay)/(1-o.delay)));o.d.style.top=(35+q*q*70)+'%';o.d.style.left=(50+o.l*q*q*55)+'%';o.d.style.fontSize=(.5+q*q*3.6)+'rem';o.d.style.opacity=q>0?1:0});
        if(p>=1.05){fin=true;done(false)}else requestAnimationFrame(f)};requestAnimationFrame(f)});
    flash(c,res);await c.sleep(500)}
  c.finish(`${nb} objects, ${(D/1000).toFixed(1)} s approach`);
}}
];

/* ---------- screens ---------- */
const app=$('#app');
let live=null;
const TIERS=[{name:'Beginner',sub:'Slow and forgiving',c:'var(--t1)'},{name:'Medium',sub:'Faster, more to hold in mind',c:'var(--t2)'},{name:'Advanced',sub:'Split-second flashes, heavy load',c:'var(--t3)'}];
const PASS=.7,LEVELS=9,tierOf=L=>L<=3?0:L<=6?1:2;
const starsFor=acc=>acc>=.95?3:acc>=.85?2:acc>=PASS?1:0;
const LOCK=SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',18);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function meta(){if(!store.__meta||!Array.isArray(store.__meta.days))store.__meta={days:[]};return store.__meta}
function rec(g){const e=store[g.id]||(store[g.id]={plays:0});if(!e.lv)e.lv=1;if(!e.stars||typeof e.stars!=='object')e.stars={};if(!e.acc||typeof e.acc!=='object')e.acc={};return e}
const starsOf=g=>Object.values(rec(g).stars).reduce((a,b)=>a+b,0);
function streak(){const s=new Set(meta().days);const d=new Date();let n=0;if(!s.has(ymd(d)))d.setDate(d.getDate()-1);while(s.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function todaysPick(){const seed=[...ymd(new Date())].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7);const min=Math.min(...GAMES.map(starsOf)),pool=GAMES.filter(g=>starsOf(g)===min);return pool[seed%pool.length]}
const catVars=cat=>`--cc:${cat.c};--on:${cat.on}`;
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
const firstSentence=d=>d.split('. ')[0].replace(/\.$/,'')+'.';
const starRow=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function stopLive(){if(live){live.alive=false;live.clear();live=null}hush()}
let atHome=true;window.__back=()=>{if(atHome)return false;home();return true};

/* ---------- brain report: weak areas + suggestions ---------- */
function gstat(g){const e=rec(g),h=Array.isArray(e.hist)?e.hist:[],recent=h.slice(-5),acc=recent.length?Math.round(recent.reduce((a,x)=>a+x.acc,0)/recent.length):null;
  const cleared=Object.values(e.stars).filter(s=>s>0).length,fails=h.filter(x=>x.L===e.lv&&x.acc<PASS*100).length;
  return {g,e,acc,cleared,played:h.length>0,sessions:h.length,stuck:fails>=2,fails,score:acc==null?null:Math.round(.6*acc+.4*(cleared/LEVELS)*100)}}
function areaStats(){return Object.entries(CATS).map(([k,cat])=>{const gs=GAMES.filter(g=>g.cat===k).map(gstat),pl=gs.filter(s=>s.played);
  const score=pl.length?Math.round(pl.reduce((a,s)=>a+s.score,0)/pl.length):null,acc=pl.length?Math.round(pl.reduce((a,s)=>a+s.acc,0)/pl.length):null,lv=pl.length?Math.round(pl.reduce((a,s)=>a+s.e.lv,0)/pl.length):0;
  return {k,cat,gs,pl,score,acc,lv,sessions:pl.reduce((a,s)=>a+s.sessions,0)}})}
function suggestions(){const areas=areaStats(),trained=areas.filter(a=>a.score!=null).sort((a,b)=>a.score-b.score),out=[],used=new Set();
  const add=(s,why,L)=>{if(s&&!used.has(s.g.id)&&out.length<3){used.add(s.g.id);out.push({g:s.g,L:L||s.e.lv,why})}};
  if(trained.length){const w=trained[0];const s=w.pl.slice().sort((a,b)=>a.acc-b.acc)[0];
    add(s,`${w.cat.name} is your weakest area (${w.score}/100). Your recent accuracy here is ${s.acc}%.`)}
  const stuck=GAMES.map(gstat).filter(s=>s.stuck).sort((a,b)=>b.fails-a.fails)[0];
  if(stuck)add(stuck,`You've missed level ${stuck.e.lv} ${stuck.fails} times. Another run will get you through.`);
  const untrained=areas.filter(a=>a.score==null);
  if(untrained.length){const a=untrained[0];add(a.gs[0],`You haven't trained ${a.cat.name} yet. Start here to add it to your report.`,1)}
  if(trained.length>1){const w=trained[1];const s=w.pl.slice().sort((a,b)=>a.acc-b.acc)[0];add(s,`${w.cat.name} is your next weakest area (${w.score}/100).`)}
  areas.forEach(a=>{const s=a.gs.find(x=>!x.played);if(s)add(s,`New in ${a.cat.name}: try it at level 1.`,1)});
  return out}
function reportCard(){const areas=areaStats(),tr=areas.filter(a=>a.score!=null).sort((a,b)=>a.score-b.score);
  const line=tr.length?`Needs work: <b>${tr[0].cat.name}</b>${tr.length>1?` · Strongest: <b>${tr[tr.length-1].cat.name}</b>`:''}`:'Play a few exercises to build your profile';
  return `<button class="rcard" id="rep"><span class="rbars">${areas.map(a=>`<i style="--cc:${a.cat.c};height:${a.score==null?8:Math.max(12,a.score)}%"></i>`).join('')}</span>
    <span class="rtx"><span class="eyebrow">Brain report</span><span>${line}</span></span><span class="rgo">${SVG('<path d="M9 5l7 7-7 7"/>',20)}</span></button>`}
function report(){
  stopLive();atHome=false;app.removeAttribute('style');const areas=areaStats(),tr=areas.filter(a=>a.score!=null).sort((a,b)=>a.score-b.score),sugg=suggestions();
  const weak=GAMES.map(gstat).filter(s=>s.played&&(s.acc<PASS*100||s.stuck)).sort((a,b)=>a.acc-b.acc).slice(0,5);
  const total=areas.reduce((a,x)=>a+x.sessions,0);
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Back">${BACK}</button><h2><small>Based on ${total} recent session${total===1?'':'s'}</small>Brain report</h2></div>
   <div class="scroll" style="padding-top:18px">
    ${tr.length?`<div class="sw2"><div class="swc" style="${catVars(tr[tr.length-1].cat)}"><span class="eyebrow">Strongest</span><b>${tr[tr.length-1].cat.name}</b><em>${tr[tr.length-1].score}/100</em></div>
      <div class="swc" style="${catVars(tr[0].cat)}"><span class="eyebrow">Needs work</span><b>${tr[0].cat.name}</b><em>${tr[0].score}/100</em></div></div>`
      :`<p class="note">Play a few exercises in different areas. Your scores, weak spots and suggestions will appear here.</p>`}
    <section><h3 class="sec-h">Your six areas</h3><div class="areas">${areas.map(a=>`<div class="arow" style="${catVars(a.cat)}">
      <div class="atop"><b>${a.cat.name}</b><span>${a.score==null?'Not trained yet':`${a.score}/100`}</span></div>
      <div class="abar"><i style="width:${a.score==null?0:a.score}%"></i></div>
      <p>${a.score==null?a.cat.sub:`Accuracy ${a.acc}% · average level ${a.lv} (${TIERS[tierOf(a.lv)].name}) · ${a.pl.length} of ${a.gs.length} exercises tried`}</p></div>`).join('')}</div></section>
    ${weak.length?`<section><h3 class="sec-h">Weak spots</h3><div class="weak">${weak.map(s=>`<div class="wrow" style="${catVars(CATS[s.g.cat])}"><span class="gic2">${icon(s.g.id,22)}</span>
      <span class="wtx"><b>${s.g.name}</b><span>${s.stuck?`Stuck on level ${s.e.lv} · ${s.fails} misses`:`Level ${s.e.lv}`} · recent accuracy ${s.acc}%</span></span></div>`).join('')}</div></section>`:''}
    <section><h3 class="sec-h">Suggested for you</h3><div class="sugg">${sugg.map((s,i)=>`<div class="srow" style="${catVars(CATS[s.g.cat])}"><div class="shead"><span class="gic2">${icon(s.g.id,22)}</span>
      <span class="wtx"><b>${s.g.name}</b><span>${CATS[s.g.cat].name} · Level ${s.L}</span></span><button class="sgo" data-i="${i}">Play</button></div><p>${s.why}</p></div>`).join('')}</div></section>
    <p class="note">Area scores mix your accuracy over your last five sessions of each exercise (60%) with how many levels you've cleared (40%).</p>
   </div>`;
  $('#bk').onclick=home;app.querySelectorAll('.sgo').forEach(b=>b.onclick=()=>{const s=sugg[+b.dataset.i];AC();play(s.g,s.L)});
}

function home(){
  stopLive();atHome=true;app.removeAttribute('style');
  const tp=todaysPick(),sg=suggestions()[0]||{g:tp,L:rec(tp).lv,why:'Today\'s pick.'},pick=sg.g,pc=CATS[pick.cat],total=GAMES.reduce((a,g)=>a+starsOf(g),0);
  app.innerHTML=`<div class="scroll">
    <header class="home-head"><div><p class="eyebrow">${greet()}</p><h1>Mind Gym</h1></div>
      <div class="stats"><div class="stat"><b>${streak()}</b><span>day streak</span></div><div class="stat"><b>★ ${total}</b><span>of ${GAMES.length*LEVELS*3}</span></div></div></header>
    <button class="pick" id="pick" style="${catVars(pc)}"><span class="bgi">${icon(pick.id,150)}</span><span class="pick-ic">${icon(pick.id,34)}</span>
      <span class="pick-tx"><span class="eyebrow">Suggested for you · ${pc.name}</span><b>${pick.name}</b><em>${sg.why}</em></span><span class="play">Play level ${sg.L}</span></button>
    ${reportCard()}
  </div>`;
  $('#pick').onclick=()=>intro(pick,sg.L);$('#rep').onclick=report;
  const sc=$('.scroll',app);
  Object.entries(CATS).forEach(([k,cat])=>{
    const list=GAMES.filter(g=>g.cat===k),sec=mk('section','cat');sec.style.cssText=catVars(cat);
    const cs=list.reduce((a,g)=>a+starsOf(g),0);
    sec.innerHTML=`<div class="cat-h"><h3><i></i>${cat.name}</h3><span>★ ${cs} / ${list.length*LEVELS*3}</span></div><p class="sub">${cat.sub}</p>`;
    const rail=mk('div','rail');
    list.forEach(g=>{const b=mk('button','gcard'),e=rec(g),cleared=Object.keys(e.stars).filter(L=>e.stars[L]>0).length;
      b.innerHTML=`<span class="bgi">${icon(g.id,100)}</span><span class="gic">${icon(g.id,26)}</span><b>${g.name}</b>
        <span class="lvbar" aria-label="${cleared} of ${LEVELS} levels cleared">${[...Array(LEVELS)].map((_,i)=>`<i class="${e.stars[i+1]>0?'on':''}"></i>`).join('')}</span>
        <span class="meta"><span class="pill">Lv ${e.lv}</span><span class="pill">★ ${starsOf(g)}</span>${g.needsAudio?`<span class="pill" title="Uses sound">${SPK(13)}</span>`:''}</span>`;
      b.onclick=()=>intro(g);rail.append(b)});
    sec.append(rail);sc.append(sec)});
}
function intro(g,selL){
  stopLive();atHome=false;const cat=CATS[g.cat],e=rec(g);app.style.cssText=catVars(cat);let sel=Math.min(selL||e.lv,e.lv);
  const paren=(g.desc.match(/\(([^)]+)\)/)||[])[1];
  const steps=g.desc.replace(/\([^)]*\)/,'').split(/(?<=\.)\s+/).map(s=>s.trim()).filter(Boolean);
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Back">${BACK}</button><h2><small>${cat.name}</small></h2><span class="scorepill">★ ${starsOf(g)}</span></div>
   <div class="intro"><div class="ihead"><div class="bigic">${icon(g.id,40)}</div><h1>${g.name}</h1></div>
    <div><p class="eyebrow" style="margin-bottom:10px">Choose a level</p><div class="levels" id="lvls"></div></div>
    <div><p class="eyebrow" style="margin-bottom:12px">How to play</p><ol class="steps">${steps.map(s=>`<li><span>${s}</span></li>`).join('')}</ol></div>
    ${g.needsAudio?`<p class="note">${SPK(18)} Turn your sound on for this one.</p>`:''}${paren?`<p class="note">${paren}</p>`:''}
   </div><div class="dock"><button class="cta" id="go"></button></div>`;
  const draw=()=>{$('#lvls').innerHTML=TIERS.map((T,ti)=>`<div class="tier" style="--tc:${T.c}"><div class="tier-h"><b>${T.name}</b><span>${T.sub}</span></div><div class="lvrow">${[1,2,3].map(j=>{const L=ti*3+j,lock=L>e.lv,s=e.stars[L]||0;
      return `<button class="lvb${L===sel?' sel':''}" data-l="${L}" ${lock?`disabled aria-label="Level ${L} locked"`:`aria-label="Level ${L}, ${s} stars"`}><b>${lock?LOCK:L}</b><span>${lock?'&nbsp;':starRow(s)}</span></button>`}).join('')}</div></div>`).join('');
    $('#lvls').querySelectorAll('.lvb:not([disabled])').forEach(b=>b.onclick=()=>{sel=+b.dataset.l;draw()});
    $('#go').textContent=`Start level ${sel} · ${TIERS[tierOf(sel)].name}`};
  draw();
  $('#bk').onclick=home;
  $('#go').onclick=()=>{AC();if(!NATIVE&&hasSpeech&&g.needsAudio){try{speechSynthesis.speak(new SpeechSynthesisUtterance(' '))}catch(e){}}play(g,sel)};
}
function play(g,L){
  stopLive();atHome=false;const cat=CATS[g.cat];app.style.cssText=catVars(cat);
  app.innerHTML=`<div class="top"><button class="ib" id="bk" aria-label="Quit">${CLOSE}</button><h2><small>Level ${L} · ${TIERS[tierOf(L)].name}</small>${g.name}</h2><span class="scorepill" id="st"></span></div>
   <p id="hint"></p><div id="stage"></div>`;
  const timers=new Set();let done=false;
  const c={alive:true,stage:$('#stage'),L,t:(L-1)/(LEVELS-1),right:0,wrong:0,
    clear(){timers.forEach(clearTimeout);timers.clear()},
    after(fn,ms){const id=setTimeout(()=>{timers.delete(id);if(c.alive)fn()},ms);timers.add(id);return id},
    sleep(ms){return new Promise(r=>c.after(r,ms))},
    say(t,rate){return say(t,rate).then(()=>new Promise(r=>{if(c.alive)r()}))},
    tally(ok){ok?c.right++:c.wrong++;const s=$('#st');if(s)s.textContent=`${c.right}/${c.right+c.wrong}`},
    stat(){},
    hint(t){const h=$('#hint');if(h)h.textContent=t},
    timer(sec,cb){c.after(cb,sec*1000)},
    finish(note,accOverride){if(done||!c.alive)return;done=true;c.alive=false;c.clear();
      const tot=c.right+c.wrong,acc=accOverride!=null?accOverride:tot?c.right/tot:0,stars=starsFor(acc),pts=Math.round(acc*100*L);
      const e=rec(g),prevStars=e.stars[L]||0;e.plays++;e.best=Math.max(e.best||0,pts);e.stars[L]=Math.max(prevStars,stars);e.acc[L]=Math.max(e.acc[L]||0,Math.round(acc*100));e.hist=(Array.isArray(e.hist)?e.hist:[]).concat({L,acc:Math.round(acc*100),d:ymd(new Date())}).slice(-20);
      let unlocked=false;if(stars>0&&L===e.lv&&L<LEVELS){e.lv=L+1;unlocked=true}
      const m=meta(),t=ymd(new Date());if(!m.days.includes(t)){m.days.push(t);if(m.days.length>400)m.days.shift()}save();
      result(g,L,acc,pts,stars,prevStars,note,unlocked)}
  };
  live=c;$('#bk').onclick=()=>intro(g,L);
  (async()=>{for(const n of ['3','2','1']){c.stage.innerHTML=`<div class="count"><span>${n}</span></div>`;await c.sleep(600)}c.stage.innerHTML='';return g.run(c)})()
    .catch(err=>{console.error(err);if(c.alive)c.hint('Something went wrong. Tap ✕ to go back.')});
}
function result(g,L,acc,pts,stars,prevStars,note,unlocked){
  live=null;const cat=CATS[g.cat],e=rec(g);app.style.cssText=catVars(cat);const pass=stars>0,pct=Math.round(acc*100);
  const star=f=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="${f?'var(--c-spd)':'var(--line)'}" stroke="${f?'var(--c-spd)':'var(--line)'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  const nextT=L<LEVELS&&tierOf(L+1)!==tierOf(L)?TIERS[tierOf(L+1)].name:null;
  const msg=!pass?'Not yet':L===LEVELS&&stars===3?'Mastered!':`Level ${L} cleared!`;
  const sub=!pass?`You need ${Math.round(PASS*100)}% to clear level ${L}. Try again.`:unlocked?`Level ${L+1} unlocked${nextT?` · ${nextT} mode is open`:''}.`:stars<3?`${stars===1?85:95}% earns the next star.`:'Perfect score on this level.';
  app.innerHTML=`<div class="top"><button class="ib" id="x" aria-label="Back to levels">${CLOSE}</button><h2><small>Level ${L} · ${TIERS[tierOf(L)].name}</small>${g.name}</h2></div>
   <div class="res"><div class="stars" aria-label="${stars} of 3 stars">${[1,2,3].map(i=>star(i<=stars)).join('')}</div>
    <div class="ring${pass?'':' fail'}"><b>${pct}%</b><span>accuracy</span></div>
    <h2 class="msg">${msg}</h2><p class="note" style="justify-content:center;text-align:center">${sub}</p>${note?`<p class="note" style="justify-content:center">${note}</p>`:''}
    <div class="tiles2" style="width:100%"><div class="tile2"><b>+${pts}</b><span>Points</span></div><div class="tile2"><b>${starRow(e.stars[L]||0)}</b><span>Best on level ${L}</span></div></div>
   </div><div class="dock">${pass&&L<LEVELS?`<button class="cta" id="next">Next: level ${L+1}</button><button class="ghost" id="again">Replay level ${L}</button>`:`<button class="cta" id="again">${pass?'Play again':'Try again'}</button>`}<button class="ghost" id="hm">All exercises</button></div>`;
  $('#again').onclick=()=>play(g,L);$('#hm').onclick=home;$('#x').onclick=()=>intro(g,L);if($('#next'))$('#next').onclick=()=>play(g,L+1);
  if(stars>prevStars||unlocked){const cf=mk('div','confetti'),cols=['var(--c-att)','var(--c-spd)','var(--c-mem)','var(--c-ppl)','var(--c-int)','var(--c-nav)'];
    for(let i=0;i<36;i++){const p=mk('i');p.style.left=rnd(100)+'%';p.style.background=pick(cols);p.style.animationDelay=(Math.random()*.6)+'s';cf.append(p)}
    $('.res').append(cf);buzz(30)}
}
home();
</script>
